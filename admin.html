<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>管理後台 — Vicauria</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73; --teal-tint:#E6F0F2;
    --warm:#C97B3D; --warm-deep:#A85F27; --warm-tint:#FBEFE2;
    --ink:#182226; --ink-soft:#5B6B70; --paper:#F5F7F6; --card:#FFFFFF; --line:#E1E7E7;
    --negative:#B3492F; --positive:#2E7D5B; --warn:#B8791E; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC",sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Noto Serif TC",serif; margin:0; color:var(--navy);}
  .wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
  .mono{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums;}

  header.hero{
    background:linear-gradient(135deg,var(--navy) 0%,var(--teal-deep) 60%,var(--teal) 100%);
    color:#fff; padding:26px 0 54px; padding-top:calc(26px + env(safe-area-inset-top, 0px));
  }
  .hero-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .eyebrow{font-family:"Roboto Mono",monospace; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#BFE0EA; font-weight:700; margin-bottom:8px;}
  header.hero h1{color:#fff; font-size:clamp(22px,2.8vw,28px);}
  header.hero p{color:#DCEAEE; font-size:13px; margin:6px 0 0; max-width:620px;}
  .hero-links{display:flex; gap:8px; flex-wrap:wrap;}
  .hero-btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px;
    border:1px solid rgba(255,255,255,.35); color:#fff; text-decoration:none; font-size:12.5px; font-weight:700;
    background:rgba(255,255,255,.08); cursor:pointer; font-family:inherit;
  }
  .hero-btn:hover{background:rgba(255,255,255,.18);}

  main{margin-top:-30px; position:relative; padding-bottom:80px;}

  .tabs{
    display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:5px; box-shadow:0 10px 30px rgba(20,50,60,0.08); margin-bottom:22px; overflow-x:auto;
  }
  .tabs button{
    flex:1; min-width:max-content; padding:11px 18px; border:none; background:none; border-radius:8px;
    font-family:inherit; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .tabs button:hover{color:var(--navy);}
  .tabs button.active{background:var(--navy); color:#fff;}
  .tabs .count{
    font-family:"Roboto Mono",monospace; font-size:11px; min-width:20px; padding:1px 7px; border-radius:10px;
    background:var(--negative); color:#fff;
  }
  .tabs .count:empty{display:none;}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .card-head h2{font-size:16px;}
  .card-head .sub{font-size:12px; color:var(--ink-soft);}

  /* ---- 總覽 ---- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:860px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .kpi .lbl{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .kpi .val{font-family:"Roboto Mono",monospace; font-weight:700; font-size:26px; color:var(--navy); line-height:1.1;}
  .kpi .note{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .kpi.attention{border-color:rgba(179,73,47,.35); background:rgba(179,73,47,.05);}
  .kpi.attention .val{color:var(--negative);}

  .two-col{display:grid; grid-template-columns:1.2fr 1fr; gap:18px;}
  @media (max-width:860px){.two-col{grid-template-columns:1fr;}}

  .bars{display:flex; align-items:flex-end; gap:10px; height:170px; padding:10px 4px 0; border-bottom:1px solid var(--line);}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .bar-num{font-family:"Roboto Mono",monospace; font-size:12px; font-weight:700; color:var(--navy);}
  .bar{width:100%; max-width:44px; background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 100%); border-radius:6px 6px 0 0; min-height:2px;}
  .bar.zero{background:var(--line);}
  .bar-labels{display:flex; gap:10px; padding:6px 4px 0;}
  .bar-labels span{flex:1; text-align:center; font-family:"Roboto Mono",monospace; font-size:10.5px; color:var(--ink-soft);}

  .mini-list{list-style:none; margin:0; padding:0;}
  .mini-list li{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .mini-list li:last-child{border-bottom:none;}
  .mini-list .who{font-weight:700; color:var(--navy);}
  .mini-list .who small{display:block; font-weight:400; color:var(--ink-soft); font-size:11.5px;}
  .mini-list .when{color:var(--ink-soft); font-size:12px; white-space:nowrap;}

  /* ---- 表格 ---- */
  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .search{
    flex:1; min-width:200px; padding:10px 14px; border:1.5px solid var(--line); border-radius:9px;
    font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--card);
  }
  .search:focus{outline:none; border-color:var(--teal);}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card);}
  table.data{width:100%; border-collapse:collapse; font-size:13px; min-width:860px;}
  table.data th{
    text-align:left; font-size:11.5px; font-weight:700; color:var(--ink-soft); background:var(--paper);
    padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.data td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.data tr:last-child td{border-bottom:none;}
  table.data td.num, table.data th.num{text-align:right;}
  table.data td.num{font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums;}
  .user-name{font-weight:700; color:var(--navy);}
  .user-email{font-size:12px; color:var(--ink-soft); word-break:break-all;}
  .when-abs{font-size:11.5px; color:var(--ink-soft);}
  .muted{color:var(--ink-soft);}

  .tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; margin:0 4px 4px 0; white-space:nowrap;}
  .tag.admin{background:var(--navy); color:#fff;}
  .tag.warn{background:rgba(184,121,30,.14); color:var(--warn);}
  .tag.team{background:var(--teal-tint); color:var(--teal-deep);}
  .tag.owner{background:var(--warm-tint); color:var(--warm-deep);}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .dot.on{background:var(--positive);} .dot.mid{background:var(--warn);} .dot.off{background:var(--line);}

  /* ---- 意見箱 ---- */
  .pills{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{
    padding:7px 14px; border-radius:18px; border:1.5px solid var(--line); background:var(--card);
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .pill.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .pill .n{font-family:"Roboto Mono",monospace; margin-left:4px; opacity:.8;}
  .fb-list{display:flex; flex-direction:column; gap:12px;}
  .fb{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; border-left:4px solid var(--line);}
  .fb.s-new{border-left-color:var(--negative);}
  .fb.s-doing{border-left-color:var(--warn);}
  .fb.s-done{border-left-color:var(--positive); opacity:.85;}
  .fb-top{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
  .fb-meta{font-size:12px; color:var(--ink-soft);}
  .fb-meta b{color:var(--navy);}
  .fb-cat{font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; margin-right:8px;}
  .fb-cat.bug{background:rgba(179,73,47,.12); color:var(--negative);}
  .fb-cat.idea{background:var(--teal-tint); color:var(--teal-deep);}
  .fb-cat.other{background:var(--paper); color:var(--ink-soft);}
  .fb-msg{font-size:14px; white-space:pre-wrap; word-break:break-word; line-height:1.8;}
  .fb-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:flex-start;}
  .fb-actions select, .fb-actions input{
    padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:12.5px; background:var(--card); color:var(--ink);
  }
  .fb-actions input{flex:1; min-width:180px;}
  .btn{
    padding:8px 16px; border:none; border-radius:18px; background:var(--navy); color:#fff;
    font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .btn:hover{background:var(--teal-deep);}
  .btn:disabled{opacity:.6; cursor:default;}
  .saved-hint{font-size:12px; color:var(--positive); align-self:center;}

  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;}
  .gate{max-width:560px; margin:40px auto; text-align:center;}
  .gate .card{padding:34px 30px;}
  .gate h2{font-size:18px; margin-bottom:10px;}
  .gate p{font-size:13.5px; color:var(--ink-soft); line-height:1.9; margin:0 0 8px;}
  .gate code{background:var(--paper); padding:2px 6px; border-radius:4px; font-size:12px;}
  .privacy-note{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  /* ---- 功能使用 ---- */
  .usage-toolbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
  .usage-toolbar label{font-size:12.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:6px; cursor:pointer;}
  .rank{display:flex; flex-direction:column; gap:2px;}
  .rank-row{display:grid; grid-template-columns:150px 1fr 70px 70px 96px 92px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .rank-row:last-child{border-bottom:none;}
  .rank-row.head{font-size:11.5px; color:var(--ink-soft); font-weight:700; padding-top:0;}
  .rank-row .nm{font-weight:700; color:var(--navy);}
  .rank-row .num{text-align:right; font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums;}
  .rank-row.cold .nm{color:var(--ink-soft);}
  .hbar{height:10px; background:var(--paper); border-radius:5px; overflow:hidden;}
  .hbar > i{display:block; height:100%; background:linear-gradient(90deg,var(--teal) 0%,var(--teal-deep) 100%); border-radius:5px;}
  .rank-row.cold .hbar > i{background:var(--line);}
  .delta{font-size:11.5px; font-weight:700;}
  .delta.up{color:var(--positive);} .delta.down{color:var(--negative);} .delta.flat{color:var(--ink-soft);}
  @media (max-width:760px){
    .rank-row{grid-template-columns:96px 1fr 44px 58px; gap:8px;}
    .rank-row > :nth-child(4), .rank-row > :nth-child(6){display:none;}
  }
  .funnel{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:760px){.funnel{grid-template-columns:repeat(2,1fr);}}
  .fstep{background:var(--paper); border-radius:12px; padding:14px 16px;}
  .fstep .lbl{font-size:12px; color:var(--ink-soft);}
  .fstep .val{font-family:"Roboto Mono",monospace; font-size:24px; font-weight:700; color:var(--navy);}
  .fstep .conv{font-size:11.5px; color:var(--teal-deep); font-weight:700;}
  .kv{list-style:none; margin:0; padding:0;}
  .kv li{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv li:last-child{border-bottom:none;}
  .kv .num{font-family:"Roboto Mono",monospace; white-space:nowrap;}
  .kv .num small{color:var(--ink-soft); font-size:11px; margin-left:4px;}
  .sub-h{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 0 4px;}
  .sub-h:first-child{margin-top:0;}
  .tip-box{background:var(--warm-tint); color:var(--warm-deep); border-radius:10px; padding:12px 16px; font-size:12.5px; line-height:1.8; margin-bottom:16px;}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap hero-row">
    <div>
      <div class="eyebrow">Admin Console · 管理後台</div>
      <h1>Vicauria 管理後台</h1>
      <p>註冊狀況、使用情形、意見回饋一頁看完。這裡只看帳號與數字，看不到任何客戶的姓名或財務內容。</p>
    </div>
    <div class="hero-links">
      <button class="hero-btn" id="btnRefresh" type="button">↻ 重新整理</button>
      <a class="hero-btn" href="workbench.html">← 回工作台</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <nav class="tabs" id="tabs">
      <button class="active" data-tab="overview">📊 總覽</button>
      <button data-tab="users">👤 使用者 <span class="count mono" id="tabCountUsers" style="background:var(--teal-deep);"></span></button>
      <button data-tab="feedback">💬 意見箱 <span class="count mono" id="tabCountFeedback"></span></button>
      <button data-tab="teams">👥 團隊</button>
      <button data-tab="usage">📈 功能使用</button>
    </nav>

    <!-- 總覽 -->
    <section class="panel active" id="panel-overview">
      <div class="kpi-grid" id="kpiGrid"></div>
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h2>每週新註冊</h2><span class="sub">最近 8 週</span></div>
          <div class="bars" id="signupBars"></div>
          <div class="bar-labels" id="signupLabels"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>最近註冊</h2><span class="sub">最新 6 位</span></div>
          <ul class="mini-list" id="recentUsers"></ul>
        </div>
      </div>
    </section>

    <!-- 使用者 -->
    <section class="panel" id="panel-users">
      <div class="toolbar">
        <input class="search" id="userSearch" type="search" placeholder="搜尋名稱或 Email">
        <div class="pills" id="userFilter">
          <button class="pill active" data-f="all">全部</button>
          <button class="pill" data-f="active">7 天內有登入</button>
          <button class="pill" data-f="unconfirmed">尚未驗證信箱</button>
          <button class="pill" data-f="idle">註冊後還沒用過</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th>使用者</th><th>註冊</th><th>最後登入</th>
            <th class="num">客戶數</th><th class="num">報告數</th><th>最近產出報告</th><th>團隊</th>
          </tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
      <div class="privacy-note">客戶數、報告數只統計數量，後台看不到任何客戶的內容。</div>
    </section>

    <!-- 意見箱 -->
    <section class="panel" id="panel-feedback">
      <div class="toolbar">
        <div class="pills" id="fbFilter">
          <button class="pill active" data-f="open">待處理<span class="n" id="fbN-open"></span></button>
          <button class="pill" data-f="new">未處理<span class="n" id="fbN-new"></span></button>
          <button class="pill" data-f="doing">處理中<span class="n" id="fbN-doing"></span></button>
          <button class="pill" data-f="done">已完成<span class="n" id="fbN-done"></span></button>
          <button class="pill" data-f="all">全部<span class="n" id="fbN-all"></span></button>
        </div>
      </div>
      <div class="fb-list" id="fbList"></div>
    </section>

    <!-- 團隊 -->
    <section class="panel" id="panel-teams">
      <div class="table-wrap">
        <table class="data" style="min-width:640px;">
          <thead><tr><th>團隊名稱</th><th>主管</th><th class="num">成員數</th><th class="num">討論篇數</th><th>建立日期</th></tr></thead>
          <tbody id="teamRows"></tbody>
        </table>
      </div>
    </section>

    <!-- 功能使用 -->
    <section class="panel" id="panel-usage">
      <div class="usage-toolbar">
        <div class="pills" id="usageDays">
          <button class="pill" data-d="7">近 7 天</button>
          <button class="pill active" data-d="30">近 30 天</button>
          <button class="pill" data-d="90">近 90 天</button>
        </div>
        <label><input type="checkbox" id="usageIncludeAdmin"> 包含管理者自己的使用</label>
      </div>
      <div id="usageBody"><div class="card empty">載入中…</div></div>
    </section>
  </div>
</main>

<script src="vendor/supabase-js-2.117.2.js"></script>
<script src="supabase-config.js"></script>
<script src="xiaov-kb.js"></script>
<script>
/* ============================================================
   Vicauria 管理後台
   資料全部來自 Supabase 的 vc_admin_* 函式（見 supabase-admin-schema.sql），
   函式會先確認登入者在管理者名單裡，才回傳資料；不是管理者什麼都拿不到。
   ============================================================ */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => Number(n||0).toLocaleString('zh-TW');
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
}
function fmtDateTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function relTime(iso){
  if(!iso) return '從未';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if(diff < 60) return '剛剛';
  if(diff < 3600) return Math.floor(diff/60) + ' 分鐘前';
  if(diff < 86400) return Math.floor(diff/3600) + ' 小時前';
  const days = Math.floor(diff/86400);
  if(days < 30) return days + ' 天前';
  if(days < 365) return Math.floor(days/30) + ' 個月前';
  return Math.floor(days/365) + ' 年前';
}
const daysSince = iso => iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity;

const state = { overview:null, users:[], feedback:[], teams:[], userFilter:'all', userQuery:'', fbFilter:'open' };

/* ---------------- 進入檢查 ---------------- */
function showGate(title, html){
  const gate = document.getElementById('gate');
  gate.innerHTML = `<div class="card"><h2>${title}</h2>${html}</div>`;
  gate.hidden = false;
  document.getElementById('app').hidden = true;
}

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'login.html'; return; }

  const { data: isAdmin, error } = await supabaseClient.rpc('vc_is_admin');
  if(error){
    showGate('後台還沒設定完成',
      `<p>資料庫裡還找不到後台需要的設定。</p>
       <p>請到 Supabase 的 SQL Editor，執行 <code>supabase-admin-schema.sql</code> 這份檔案，再回來重新整理。</p>
       <p style="font-size:11.5px;">（系統訊息：${esc(error.message)}）</p>`);
    return;
  }
  if(!isAdmin){
    showGate('沒有後台權限',
      `<p>這個帳號（${esc(session.user.email)}）不在管理者名單裡。</p>
       <p><a href="workbench.html">回工作台</a></p>`);
    return;
  }
  document.getElementById('app').hidden = false;
  await loadAll();
}

async function loadAll(){
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true; btn.textContent = '載入中…';
  const [ov, us, fb, tm] = await Promise.all([
    supabaseClient.rpc('vc_admin_overview'),
    supabaseClient.rpc('vc_admin_users'),
    supabaseClient.rpc('vc_admin_feedback'),
    supabaseClient.rpc('vc_admin_teams'),
  ]);
  btn.disabled = false; btn.textContent = '↻ 重新整理';
  const firstErr = [ov, us, fb, tm].find(r => r.error);
  if(firstErr){
    showGate('資料讀取失敗', `<p>${esc(firstErr.error.message)}</p><p>請稍後重新整理再試一次。</p>`);
    return;
  }
  state.overview = ov.data || {};
  state.users = us.data || [];
  state.feedback = fb.data || [];
  state.teams = tm.data || [];
  renderOverview(); renderUsers(); renderFeedback(); renderTeams();
  loadUsage(); // 功能使用另外載入：還沒跑 SQL 也不會影響其他分頁
}

/* ---------------- 使用者 ---------------- */
function userMatches(u){
  const q = state.userQuery.trim().toLowerCase();
  if(q && !(`${u.display_name} ${u.email}`.toLowerCase().includes(q))) return false;
  switch(state.userFilter){
    case 'active': return daysSince(u.last_sign_in_at) <= 7;
    case 'unconfirmed': return !u.email_confirmed;
    case 'idle': return u.client_count == 0 && u.report_count == 0;
    default: return true;
  }
}
function activityDot(iso){
  const d = daysSince(iso);
  return `<span class="dot ${d<=7?'on':(d<=30?'mid':'off')}"></span>`;
}
function renderUsers(){
  const rows = state.users.filter(userMatches);
  const tbody = document.getElementById('userRows');
  if(!rows.length){ tbody.innerHTML = `<tr><td colspan="7" class="empty">沒有符合條件的使用者</td></tr>`; return; }
  tbody.innerHTML = rows.map(u=>{
    const tags = [];
    if(u.is_admin) tags.push('<span class="tag admin">管理者</span>');
    if(!u.email_confirmed) tags.push('<span class="tag warn">未驗證信箱</span>');
    const teams = [];
    if(u.owned_team) teams.push(`<span class="tag owner">帶領：${esc(u.owned_team)}</span>`);
    if(u.joined_teams) u.joined_teams.split('、').forEach(t=> teams.push(`<span class="tag team">${esc(t)}</span>`));
    return `<tr>
      <td><div class="user-name">${esc(u.display_name || '（未命名）')}</div><div class="user-email">${esc(u.email)}</div>${tags.join('')}</td>
      <td>${fmtDate(u.created_at)}<div class="when-abs">${relTime(u.created_at)}</div></td>
      <td>${activityDot(u.last_sign_in_at)}${relTime(u.last_sign_in_at)}<div class="when-abs">${fmtDateTime(u.last_sign_in_at)}</div></td>
      <td class="num">${fmtNum(u.client_count)}</td>
      <td class="num">${fmtNum(u.report_count)}</td>
      <td>${u.last_report_at ? relTime(u.last_report_at) : '<span class="muted">還沒有</span>'}</td>
      <td>${teams.join('') || '<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('');
}

const CAT_LABEL = { bug:'功能異常', idea:'功能建議', feature:'功能建議', other:'其他' };
const STATUS_LABEL = { new:'未處理', doing:'處理中', done:'已完成' };
function renderFeedback(){
  const all = state.feedback;
  const counts = { all:all.length, new:0, doing:0, done:0 };
  all.forEach(f=> counts[f.status] = (counts[f.status]||0) + 1);
  counts.open = counts.new + counts.doing;
  Object.keys(counts).forEach(k=>{ const el = document.getElementById('fbN-'+k); if(el) el.textContent = counts[k]; });

  const list = all.filter(f=>{
    if(state.fbFilter === 'all') return true;
    if(state.fbFilter === 'open') return f.status !== 'done';
    return f.status === state.fbFilter;
  });
  const box = document.getElementById('fbList');
  if(!list.length){
    box.innerHTML = `<div class="card empty">${state.fbFilter==='open' ? '目前沒有待處理的意見 🎉' : '這個分類沒有意見'}</div>`;
    return;
  }
  box.innerHTML = list.map(f=>{
    const catKey = (f.category==='feature' ? 'idea' : f.category) || 'other';
    return `<div class="fb s-${esc(f.status)}" data-id="${esc(f.id)}">
      <div class="fb-top">
        <div class="fb-meta"><span class="fb-cat ${['bug','idea'].includes(catKey)?catKey:'other'}">${esc(CAT_LABEL[f.category] || f.category || '未分類')}</span>
          <b>${esc(f.display_name || '（未命名）')}</b>　${esc(f.email)}</div>
        <div class="fb-meta">${fmtDateTime(f.created_at)}（${relTime(f.created_at)}）${f.handled_at ? '・完成於 '+fmtDate(f.handled_at) : ''}</div>
      </div>
      <div class="fb-msg">${esc(f.message)}</div>
      <div class="fb-actions">
        <select class="fb-status">
          ${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}"${f.status===k?' selected':''}>${v}</option>`).join('')}
        </select>
        <input class="fb-note" type="text" placeholder="處理備註（只有後台看得到）" value="${esc(f.admin_note)}">
        <button class="btn fb-save" type="button">儲存</button>
        <span class="saved-hint" hidden>已儲存</span>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.fb').forEach(card=>{
    card.querySelector('.fb-save').addEventListener('click', async ()=>{
      const btn = card.querySelector('.fb-save');
      const status = card.querySelector('.fb-status').value;
      const note = card.querySelector('.fb-note').value;
      btn.disabled = true; btn.textContent = '儲存中…';
      const { error } = await supabaseClient.rpc('vc_admin_set_feedback', { p_id: card.dataset.id, p_status: status, p_note: note });
      btn.disabled = false; btn.textContent = '儲存';
      if(error){ alert('儲存失敗：' + error.message); return; }
      const f = state.feedback.find(x=> x.id === card.dataset.id);
      if(f){
        f.status = status; f.admin_note = note;
        f.handled_at = status === 'done' ? (f.handled_at || new Date().toISOString()) : null;
      }
      state.overview.feedback_open = state.feedback.filter(x=> x.status !== 'done').length;
      document.getElementById('tabCountFeedback').textContent = state.overview.feedback_open || '';
      renderOverview();
      renderFeedback();
    });
  });
}
document.querySelectorAll('#fbFilter .pill').forEach(p=> p.addEventListener('click', ()=>{

async function loadUsage(){
  const body = document.getElementById('usageBody');
  body.innerHTML = '<div class="card empty">載入中…</div>';
  const { data, error } = await supabaseClient.rpc('vc_admin_usage', { p_days: usageState.days, p_include_admins: usageState.includeAdmin });
  if(error){
    body.innerHTML = `<div class="card empty">功能使用統計還沒設定。<br>請到 Supabase 的 SQL Editor 執行 <code>vicauria-usage-tracking.sql</code>，再回來按「重新整理」。<br><span style="font-size:11.5px;">（系統訊息：${esc(error.message)}）</span></div>`;
    return;
  }
  usageState.data = data || {};
  renderUsage();

function deltaHTML(cur, prev){
  if(!prev && !cur) return '<span class="delta flat">—</span>';
  if(!prev) return '<span class="delta up">新</span>';
  const pct = Math.round((cur - prev) / prev * 100);
  if(pct === 0) return '<span class="delta flat">持平</span>';
  return `<span class="delta ${pct>0?'up':'down'}">${pct>0?'▲':'▼'} ${Math.abs(pct)}%</span>`;
}
function pct(a, b){ return b ? Math.min(100, Math.round(a / b * 100)) + '%' : '—'; }

function renderUsage(){
  const u = usageState.data;
  const body = document.getElementById('usageBody');
  const mods = u.modules || [];
  const acts = u.actions || [];
  const byMod = {}; mods.forEach(m=> byMod[m.module] = m);
  // 沒被用過的功能也列出來（人數 0），冷門功能才看得出來
  const all = Object.keys(MODULE_LABEL).map(k=> byMod[k] || { module:k, users:0, events:0, repeat_users:0, users_prev:0 });
  mods.forEach(m=>{ if(!MODULE_LABEL[m.module]) all.push(m); });
  all.sort((a,b)=> b.users - a.users || b.events - a.events);
  const maxUsers = Math.max(1, ...all.map(m=> m.users));
  const used = all.filter(m=> m.users > 0);
  const act = (module, action) => acts.filter(a=> a.module === module && a.action === action);
  // 同一個動作的「不重複人數」（不同細項加總會重複算到同一個人，所以另外由資料庫算好）
  const tot = (module, action) => (u.action_totals || []).find(t=> t.module === module && t.action === action) || { users:0, events:0 };

  const since = u.tracked_since ? fmtDate(u.tracked_since) : null;
  const trackedDays = u.tracked_since ? Math.floor(daysSince(u.tracked_since)) : 0;
  const tip = !since
    ? '<div class="tip-box">還沒有任何使用紀錄。更新上線後，顧問打開工作台就會開始累積；下方「產出量」是從現有資料算的，現在就看得到。</div>'
    : (trackedDays < 28 || (u.active_users||0) < 20
        ? `<div class="tip-box">從 ${since} 開始記錄（${trackedDays} 天、${fmtNum(u.active_users)} 位活躍使用者）。建議累積 4～6 週、20 位以上活躍使用者後再判斷功能冷熱，人太少時數字容易被一兩個人左右。</div>` : '');

  const kpis = [
    { lbl:`近 ${u.days} 天活躍使用者`, val:fmtNum(u.active_users), note:`前一期 ${fmtNum(u.active_users_prev)} 位　${deltaHTML(u.active_users, u.active_users_prev)}` },
    { lbl:'最常用', val:used[0] ? esc(MODULE_LABEL[used[0].module]||used[0].module) : '—', note:used[0] ? `${fmtNum(used[0].users)} 人使用` : '還沒有資料', small:true },
    { lbl:'回頭率最高', val:(()=>{ const r = used.filter(m=>m.users>=3).sort((a,b)=> b.repeat_users/b.users - a.repeat_users/a.users)[0]; return r ? esc(MODULE_LABEL[r.module]||r.module) : '—'; })(), note:'在不同天用過 2 次以上的比例', small:true },
    { lbl:'沒人用過的功能', val:fmtNum(all.filter(m=> m.users === 0).length), note:'見下方灰色列', attention: since && all.some(m=> m.users === 0) },
  ];

  // 財富地圖漏斗
  const bpOpen = (byMod.blueprint||{}).users || 0;
  const bpStart = tot('blueprint','start').users;
  const bpReport = tot('blueprint','report').users;
  const bpPrint = tot('blueprint','print').users;
  const funnel = [
    { lbl:'打開財富地圖', v:bpOpen },
    { lbl:'開始填寫', v:bpStart, conv:pct(bpStart, bpOpen) },
    { lbl:'產出報告', v:bpReport, conv:pct(bpReport, bpStart) },
    { lbl:'列印／存 PDF', v:bpPrint, conv:pct(bpPrint, bpReport) },
  ];

  const kvList = (list, emptyText) => list.length ? '<ul class="kv">' + list
      .sort((a,b)=> b.users - a.users || b.events - a.events)
      .map(a=> `<li><span>${esc(DETAIL_LABEL[a.detail] || KB_TITLE[a.detail] || a.detail || '—')}</span><span class="num">${fmtNum(a.users)} 人<small>${fmtNum(a.events)} 次</small></span></li>`).join('') + '</ul>'
    : `<div class="muted" style="font-size:12.5px;">${emptyText}</div>`;

  const xvAsk = act('xiaov','ask').concat(act('xiaov','chip'));
  const xvMiss = act('xiaov','unanswered');
  const askEvents = tot('xiaov','ask').events + tot('xiaov','chip').events, missEvents = tot('xiaov','unanswered').events;
  const topQ = {}; xvAsk.forEach(a=>{ topQ[a.detail] = topQ[a.detail] || { detail:a.detail, users:0, events:0 }; topQ[a.detail].users += a.users; topQ[a.detail].events += a.events; });

  const content = u.content || [];
  const daily = u.daily || [];
  const maxDaily = Math.max(1, ...daily.map(d=> d.users));
  const showEvery = daily.length > 31 ? 7 : (daily.length > 10 ? 3 : 1);

  body.innerHTML = `

    <div class="kpi-grid">${kpis.map(k=>`
      <div class="kpi${k.attention?' attention':''}">
        <div class="lbl">${k.lbl}</div>
        <div class="val" style="${k.small?'font-size:19px; font-family:\'Noto Serif TC\',serif;':''}">${k.val}</div>
        <div class="note">${k.note}</div>
      </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-head"><h2>功能使用排行</h2><span class="sub">依使用人數排序・同一人 5 分鐘內重複打開只算 1 次</span></div>
      <div class="rank">
        <div class="rank-row head"><span>功能</span><span>使用人數</span><span class="num">人數</span><span class="num">次數</span><span class="num">回頭使用</span><span class="num">比前一期</span></div>
        ${all.map(m=>`
        <div class="rank-row${m.users?'':' cold'}">
          <span class="nm">${esc(MODULE_LABEL[m.module] || m.module)}</span>
          <div class="hbar"><i style="width:${m.users ? Math.max(3, m.users/maxUsers*100) : 0}%"></i></div>
          <span class="num">${fmtNum(m.users)}</span>
          <span class="num">${fmtNum(m.events)}</span>
          <span class="num">${m.users ? `${fmtNum(m.repeat_users)}（${pct(m.repeat_users, m.users)}）` : '—'}</span>
          <span class="num">${deltaHTML(m.users, m.users_prev)}</span>
        </div>`).join('')}
      </div>
      <div class="privacy-note">回頭使用＝在不同的兩天以上都用過這個功能的人數。只記錄「打開哪個功能、什麼時間」，不記錄任何客戶內容。</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>財富地圖：大家走到哪一步</h2><span class="sub">人數・百分比是相對於前一步</span></div>
      <div class="funnel">${funnel.map(f=>`
        <div class="fstep"><div class="lbl">${f.lbl}</div><div class="val">${fmtNum(f.v)}</div><div class="conv">${f.conv ? '前一步的 ' + f.conv : '&nbsp;'}</div></div>`).join('')}

      <div class="sub-h" style="margin-top:16px;">產出報告的類型</div>
      ${kvList(act('blueprint','report'), '還沒有產出報告的紀錄')}
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-head"><h2>沙盤推演必勝</h2></div>
        <div class="sub-h">點過哪些分頁</div>

          <div class="fstep"><div class="lbl">答得出來</div><div class="val">${fmtNum(askEvents)}</div><div class="conv">${pct(askEvents, askEvents + missEvents)}</div></div>

      <div class="card">
        <div class="card-head"><h2>產出量</h2><span class="sub">近 ${u.days} 天・從現有資料計算</span></div>
        <ul class="kv">${content.map(c=>`<li><span>${esc(c.label)}</span><span class="num">${fmtNum(c.items)} 筆<small>${fmtNum(c.users)} 人</small></span></li>`).join('') || '<li class="muted">沒有資料</li>'}</ul>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>每日活躍使用者</h2><span class="sub">台灣時間</span></div>
      <div class="bars" style="gap:${daily.length > 31 ? 2 : 6}px;">${daily.map(d=>`
        <div class="bar-col" title="${d.day}：${d.users} 人、${d.events} 次">
          ${daily.length <= 31 ? `<div class="bar-num">${d.users || ''}</div>` : ''}
          <div class="bar${d.users?'':' zero'}" style="height:${d.users ? Math.max(4, d.users/maxDaily*100) : 2}%;"></div>
        </div>`).join('')}
      </div>
      <div class="bar-labels" style="gap:${daily.length > 31 ? 2 : 6}px;">${daily.map((d,i)=>{
        const dt = new Date(d.day + 'T00:00:00');
        return `<span>${(daily.length - 1 - i) % showEvery === 0 ? (dt.getMonth()+1) + '/' + dt.getDate() : ''}</span>`;
      }).join('')}</div>
    </div>`;
}
document.querySelectorAll('#usageDays .pill').forEach(p=> p.addEventListener('click', ()=>{
  document.querySelectorAll('#usageDays .pill').forEach(x=> x.classList.toggle('active', x===p));
  usageState.days = parseInt(p.dataset.d, 10); loadUsage();
}));
document.getElementById('usageIncludeAdmin').addEventListener('change', e=>{ usageState.includeAdmin = e.target.checked; loadUsage(); });

/* ---------------- 分頁切換 ---------------- */
document.querySelectorAll('#tabs button').forEach(btn=> btn.addEventListener('click', ()=>{
  document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('active', b===btn));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id === 'panel-'+btn.dataset.tab));
  try{ history.replaceState(null, '', '#'+btn.dataset.tab); }catch(e){}
}));
const startTab = (location.hash||'').replace('#','');
if(startTab){ const b = document.querySelector(`#tabs button[data-tab="${startTab}"]`); if(b) b.click(); }

document.getElementById('btnRefresh').addEventListener('click', loadAll);
init();
</script>
</body>
</html>
