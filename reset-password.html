<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>設定新密碼｜資產配置工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16323F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16323F; --ink-deep:#0F232C; --paper:#F5F7F6;
    --brass:#2E7391; --brass-light:#8FC4D8;
    --line:#E1E7E7; --ink-soft:#5B6B70; --negative:#B3492F; --positive:#2E7D5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Sans TC", sans-serif;
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:400px;
    background:#fff; border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
    padding:44px 36px 36px;
  }
  .logo-mark{
    display:block; height:34px; width:auto; margin:0 auto 12px;
  }
  .logo{
    font-family:"Roboto Mono", monospace; font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--brass); margin-bottom:16px; text-align:center;
  }
  h1{
    font-family:"Noto Serif TC", serif; font-weight:800; font-size:22px;
    color:var(--ink); text-align:center; margin:0 0 6px;
  }
  .sub{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:32px; }

  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:12.5px; font-weight:700; color:var(--ink);
    margin-bottom:7px;
  }
  .field input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:9px;
    font-size:14px; font-family:"Noto Sans TC", sans-serif; color:var(--ink);
    background:var(--paper);
  }
  .field input:focus{ outline:none; border-color:var(--brass); }

  .submit-btn{
    width:100%; margin-top:8px; padding:13px; border:none; border-radius:9px;
    background:var(--ink); color:#fff; font-size:14.5px; font-weight:700;
    cursor:pointer; font-family:"Noto Sans TC", sans-serif;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--brass); }
  .submit-btn:disabled{ opacity:.6; cursor:default; }

  .error-msg{
    display:none; background:rgba(179,73,47,0.08); border:1px solid rgba(179,73,47,0.25);
    color:var(--negative); font-size:12.5px; padding:10px 12px; border-radius:8px;
    margin-bottom:16px; line-height:1.7;
  }
  .error-msg.show{ display:block; }

  .state-box{ text-align:center; padding:20px 0; }
  .state-box p{ font-size:13.5px; color:var(--ink-soft); line-height:1.9; }
</style>
</head>
<body>

<div class="card">
  <img class="logo-mark" src="icons/vicauria-mark.png" alt="Vicauria">
  <div class="logo">Vicauria</div>
  <h1>設定新密碼</h1>
  <p class="sub">請輸入你的新密碼</p>

  <div class="error-msg" id="errorMsg"></div>

  <div class="state-box" id="checkingBox">
    <p>正在確認重設連結…</p>
  </div>

  <form id="resetForm" style="display:none;">
    <div class="field">
      <label for="newPassword">新密碼</label>
      <input type="password" id="newPassword" placeholder="至少 6 個字元" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmPassword">確認新密碼</label>
      <input type="password" id="confirmPassword" placeholder="再輸入一次新密碼" autocomplete="new-password">
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">更新密碼</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const errorMsg = document.getElementById('errorMsg');
  function showError(text){
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
  }

  // 從信件連結點進來時，Supabase SDK 會自動偵測網址裡的驗證資訊、建立一個暫時的登入狀態，
  // 讓使用者不用先登入也能設定新密碼。這裡等它處理完，再顯示表單。
  supabaseClient.auth.onAuthStateChange((event, session) => {
    document.getElementById('checkingBox').style.display = 'none';
    if(event === 'PASSWORD_RECOVERY' || session){
      document.getElementById('resetForm').style.display = 'block';
    } else {
      showError('這個重設密碼連結已經失效或不正確，請重新申請一次忘記密碼。');
    }
  });

  // 保險：如果幾秒內都沒有觸發上面的事件，代表連結有問題
  setTimeout(()=>{
    if(document.getElementById('checkingBox').style.display !== 'none') return;
  }, 4000);

  document.getElementById('resetForm').addEventListener('submit', async function(e){
    e.preventDefault();
    errorMsg.classList.remove('show');

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const submitBtn = document.getElementById('submitBtn');

    if(!newPassword || !confirmPassword){
      showError('請完整填寫兩個欄位');
      return;
    }
    if(newPassword.length < 6){
      showError('密碼至少要 6 個字元');
      return;
    }
    if(newPassword !== confirmPassword){
      showError('兩次輸入的密碼不一致');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '更新中…';

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if(error){
      submitBtn.disabled = false;
      submitBtn.textContent = '更新密碼';
      showError('更新失敗：' + error.message);
      return;
    }

    await supabaseClient.auth.signOut();
    window.location.href = 'login.html?reset=1';
  });
</script>

</body>
</html>
