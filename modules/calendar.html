<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73; --teal-tint:#E6F0F2;
    --warm:#C97B3D; --warm-deep:#A85F27; --warm-tint:#FBEFE2; --plum:#4A3B5C; --plum-tint:#EFEAF2;
    --ink:#182226; --ink-soft:#5B6B70; --paper:#F5F7F6; --card:#FFFFFF; --line:#E1E7E7;
    --negative:#B3492F; --positive:#2E7D5B; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0;color:var(--navy);}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}

  header.hero{
    background:linear-gradient(135deg,var(--navy) 0%,var(--teal-deep) 60%,var(--teal) 100%);
    color:#fff; padding:26px 0 30px; position:relative; overflow:hidden;
  }
  header.hero::after{
    content:""; position:absolute; right:-70px; top:-70px; width:180px; height:180px;
    border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,0.10) 0%,rgba(255,255,255,0) 70%);
  }
  header.hero .wrap{padding:0 20px;}
  header.hero .eyebrow{
    font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:#BFE0EA; font-weight:700; margin-bottom:8px;
  }
  header.hero h1{color:#fff; font-size:clamp(19px,2.4vw,24px); font-weight:700; margin-bottom:0;}
  header.hero p{max-width:660px; color:#DCEAEE; font-size:13px; line-height:1.8; margin-top:8px;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; margin:22px 0 4px; font-size:11.5px; color:var(--ink-soft);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .dot.mine{background:var(--teal);}
  .dot.teamshared{background:var(--warm);}
  .dot.monitor{background:var(--plum);}
  .dot.birthday{background:var(--negative);}

  .cal-panel{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(20,50,60,0.05); padding:20px 22px; margin-bottom:18px;
  }
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cal-nav .month-label{font-family:"Noto Serif TC",serif; font-weight:700; font-size:16px; color:var(--navy);}
  .cal-nav-btns{display:flex; gap:8px;}
  .cal-nav-btns button{
    appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .cal-nav-btns button:hover{background:var(--paper);}
  .btn-today{
    appearance:none; border:1px solid var(--teal); background:none; color:var(--teal-deep);
    padding:5px 12px; border-radius:14px; font-size:11.5px; font-weight:700; cursor:pointer;
    font-family:"Noto Sans TC",sans-serif; margin-left:8px;
  }
  .btn-today:hover{background:var(--teal-tint);}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{font-size:11px; color:var(--ink-soft); text-align:center; font-family:"Roboto Mono",monospace; padding-bottom:6px;}
  .cal-cell{
    min-height:74px; border-radius:10px; border:1px solid var(--line); padding:6px 6px;
    cursor:pointer; background:#fff; transition:border-color .12s ease, background .12s ease;
  }
  .cal-cell:hover{border-color:var(--teal);}
  .cal-cell.outside{background:var(--paper); color:rgba(91,107,112,0.4);}
  .cal-cell.today{border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
  .cal-cell.selected{background:var(--teal-tint); border-color:var(--teal);}
  .cal-cell .d-num{font-family:"Roboto Mono",monospace; font-size:12px; font-weight:700; margin-bottom:5px;}
  .cal-cell .d-num.holiday{color:var(--negative);}
  .cal-cell .d-holiday-label{font-size:9px; color:var(--negative); line-height:1.3; margin-bottom:3px;}
  .cal-cell .d-dots{display:flex; flex-wrap:wrap; gap:3px;}
  .cal-cell .d-dots .dot{width:6px; height:6px; border-radius:50%;}

  @media (max-width:640px){
    .cal-cell{min-height:52px;}
    .cal-dow{font-size:9.5px;}
  }

  .day-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .day-panel-head h3{font-size:15px;}
  .btn-add-event{
    background:var(--teal); color:#fff; border:none; padding:9px 18px; border-radius:18px;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
  }
  .btn-add-event:hover{background:var(--teal-deep);}

  .event-row{
    display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .event-row:last-child{border-bottom:none;}
  .event-row .e-badge{flex-shrink:0; width:8px; height:8px; border-radius:50%; margin-top:6px;}
  .event-row .e-badge.mine{background:var(--teal);}
  .event-row .e-badge.teamshared{background:var(--warm);}
  .event-row .e-badge.monitor{background:var(--plum);}
  .event-row .e-badge.birthday{background:var(--negative);}
  .event-row .e-body{flex:1; min-width:0;}
  .event-row .e-title{font-size:13.5px; font-weight:700; color:var(--ink);}
  .event-row .e-meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .event-row .e-owner{font-size:10.5px; color:var(--ink-soft); font-family:"Roboto Mono",monospace; margin-top:3px;}
  .event-row .e-actions{flex-shrink:0; display:flex; gap:6px;}
  .event-row .e-actions button{
    appearance:none; border:none; background:none; color:var(--ink-soft); cursor:pointer;
    font-size:12px; padding:4px 6px; border-radius:6px;
  }
  .event-row .e-actions button:hover{background:var(--paper); color:var(--teal-deep);}
  .empty-day{color:var(--ink-soft); font-size:12.5px; padding:20px 4px; text-align:center;}

  /* ---- 新增/編輯事件 modal ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(15,35,44,0.5);
    z-index:200; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff; border-radius:18px; padding:26px 28px; width:min(480px,100%);
    max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(20,50,60,0.3);
  }
  .modal-box h3{font-size:16px; margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; padding:9px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:13px; font-family:"Noto Sans TC",sans-serif; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .visibility-toggle{
    display:flex; align-items:center; gap:10px; background:var(--paper); border-radius:10px; padding:10px 12px;
  }
  .visibility-toggle input{width:auto;}
  .visibility-toggle .vt-text{font-size:12px; color:var(--ink);}
  .visibility-toggle .vt-sub{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
  .btn-save{
    background:var(--navy); color:#fff; border:none; padding:10px 22px; border-radius:18px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
  }
  .btn-save:hover{background:var(--teal-deep);}
  .btn-cancel{
    background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer;
    font-family:"Noto Sans TC",sans-serif;
  }
  .btn-delete-event{
    background:none; border:none; color:var(--negative); font-size:12.5px; cursor:pointer;
    font-family:"Noto Sans TC",sans-serif;
  }
  .visibility-toggle.is-disabled{opacity:.55;}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Calendar · 行事曆</div>
    <h1>約訪行程</h1>
    <p>記錄自己的約訪；如果你是團隊主管，可以把重要公告開放給整個團隊看到。每位夥伴的個人行程只有自己看得到，不會出現在其他人的行事曆上。</p>
  </div>
</header>

<div class="wrap">
  <div class="legend">
    <span><span class="dot mine"></span>我的行程</span>
    <span><span class="dot teamshared"></span>團隊公告</span>
    <span><span class="dot birthday"></span>客戶生日</span>
  </div>

  <div class="cal-panel">
    <div class="cal-nav">
      <div class="month-label" id="monthLabel">載入中…</div>
      <div class="cal-nav-btns">
        <button id="btnPrevMonth">←</button>
        <button id="btnNextMonth">→</button>
        <button class="btn-today" id="btnToday">今天</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="cal-panel">
    <div class="day-panel-head">
      <h3 id="dayPanelTitle">選一天看行程</h3>
      <button class="btn-add-event" id="btnAddEvent">＋ 新增事件</button>
    </div>
    <div id="dayEventList"></div>
  </div>
</div>

<div class="modal-overlay" id="eventOverlay">
  <div class="modal-box">
    <h3 id="eventModalTitle">新增事件</h3>
    <input type="hidden" id="eventId">
    <div class="field">
      <label>標題</label>
      <input type="text" id="fieldTitle" placeholder="例如：與陳先生約訪">
    </div>
    <div class="field-row">
      <div class="field">
        <label>開始日期</label>
        <input type="date" id="fieldDate">
      </div>
      <div class="field">
        <label>結束日期</label>
        <input type="date" id="fieldEndDate">
      </div>
    </div>
    <div class="field">
      <label class="visibility-toggle" style="margin-bottom:10px;">
        <input type="checkbox" id="fieldAllDay">
        <span>
          <span class="vt-text">全天</span>
          <div class="vt-sub">整天不指定時間（例如出國、休假、多天培訓）</div>
        </span>
      </label>
    </div>
    <div class="field-row" id="timeFieldRow">
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="fieldStart">
      </div>
      <div class="field">
        <label>結束時間</label>
        <input type="time" id="fieldEnd">
      </div>
    </div>
    <div class="field" id="recurringField">
      <label class="visibility-toggle" id="recurringToggleLabel" style="margin-bottom:10px;">
        <input type="checkbox" id="fieldRecurring">
        <span>
          <span class="vt-text">設為週期性事件</span>
          <div class="vt-sub">例如每週一固定開會，勾選後不用每週手動新增一次</div>
        </span>
      </label>
      <div id="recurringOptions" style="display:none; margin-top:10px;" class="field-row">
        <div class="field">
          <label>每幾週重複一次</label>
          <input type="text" id="fieldRecurInterval" value="1">
        </div>
        <div class="field">
          <label>重複到（結束日期）</label>
          <input type="date" id="fieldRecurUntil">
        </div>
      </div>
    </div>
    <div class="field">
      <label>連結客戶（選填）</label>
      <select id="fieldClient">
        <option value="">不連結客戶</option>
      </select>
    </div>
    <div class="field">
      <label>備註（選填）</label>
      <textarea id="fieldDesc" placeholder="約訪地點、要準備的資料等"></textarea>
    </div>
    <div class="field" id="visibilityField" style="display:none;">
      <label class="visibility-toggle">
        <input type="checkbox" id="fieldVisibility">
        <span>
          <span class="vt-text">開放給團隊</span>
          <div class="vt-sub">開啟後，你團隊裡的所有夥伴都會在自己的行事曆上看到這筆</div>
        </span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-delete-event" id="btnDeleteEvent" style="display:none;">刪除這筆事件</button>
      <div style="margin-left:auto; display:flex; gap:14px; align-items:center;">
        <button class="btn-cancel" id="btnCancelEvent">取消</button>
        <button class="btn-save" id="btnSaveEvent">儲存</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../plan-utils.js"></script>
<script>
const TIER_RANK = { free:0, pro:1, master:2 };
let myId = null;
let myPlan = 'free';
let clientBirthdaysByMonthDay = {}; // "MM-DD" -> [client name, ...]
let isTeamOwner = false;
let currentMonth = new Date(); currentMonth.setDate(1);
let selectedDate = null; // 'YYYY-MM-DD'
let monthEvents = [];    // 這個月抓到的所有事件（已含 RLS 篩選過的可見範圍）
let clientOptions = [];

function pad(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return toDateStr(new Date()); }

// 台灣國定假日／補假（依行政院人事行政總處正式公告的115年／116年辦公日曆表）
// 116年（2027）下半年之後的年度，等政院公告了要記得再補進來
const TW_HOLIDAYS = {
  '2026-01-01': '元旦',
  '2026-02-15': '除夕前一日',
  '2026-02-16': '除夕',
  '2026-02-17': '春節',
  '2026-02-18': '初二',
  '2026-02-19': '初三',
  '2026-02-20': '小年夜補假',
  '2026-02-27': '和平紀念日補假',
  '2026-02-28': '和平紀念日',
  '2026-04-03': '兒童節補假',
  '2026-04-04': '兒童節',
  '2026-04-05': '清明節',
  '2026-04-06': '清明節補假',
  '2026-05-01': '勞動節',
  '2026-06-19': '端午節',
  '2026-09-25': '中秋節',
  '2026-09-28': '教師節',
  '2026-10-09': '國慶日補假',
  '2026-10-10': '國慶日',
  '2026-10-25': '台灣光復節',
  '2026-10-26': '光復節補假',
  '2026-12-25': '行憲紀念日',
  '2027-01-01': '開國紀念日',
  '2027-02-04': '小年夜',
  '2027-02-05': '除夕',
  '2027-02-06': '初一',
  '2027-02-07': '初二',
  '2027-02-08': '初三',
  '2027-02-09': '初一補假',
  '2027-02-10': '初二補假',
  '2027-02-28': '和平紀念日',
  '2027-03-01': '和平紀念日補假',
  '2027-04-04': '兒童節',
  '2027-04-05': '清明節',
  '2027-04-06': '兒童節補假',
  '2027-04-30': '勞動節補假',
  '2027-05-01': '勞動節',
  '2027-06-09': '端午節',
  '2027-09-15': '中秋節',
  '2027-09-28': '教師節',
  '2027-10-10': '國慶日',
  '2027-10-11': '國慶日補假',
  '2027-10-25': '台灣光復節',
  '2027-12-24': '行憲紀念日補假',
  '2027-12-25': '行憲紀念日',
  '2027-12-31': '元旦補假'
};

async function init(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) return;
  myId = session.user.id;

  const effective = await fetchEffectivePlan();
  myPlan = effective.plan;

  const { data: ownedTeams } = await supabaseClient.from('teams').select('id').eq('owner_id', myId);
  // 團隊公告是 Master 方案才有的功能；就算曾經是團隊擁有者，降級後這個開關也要跟著收回
  isTeamOwner = !!(ownedTeams && ownedTeams.length > 0);
  if(isTeamOwner && TIER_RANK[myPlan] >= TIER_RANK.master){
    document.getElementById('visibilityField').style.display = 'block';
  }

  const { data: clients } = await supabaseClient
    .from('client_records')
    .select('id, client_name, birthday')
    .eq('advisor_id', myId)
    .is('deleted_at', null);
  clientOptions = clients || [];
  const sel = document.getElementById('fieldClient');
  clientOptions.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = (c.client_name || '').trim() || '（未命名客戶）';
    sel.appendChild(opt);
  });

  // 生日只看「月-日」，不管年份，每年都會在同一天提醒
  clientBirthdaysByMonthDay = {};
  clientOptions.forEach(c=>{
    if(!c.birthday) return;
    const md = c.birthday.slice(5); // "MM-DD"
    if(!clientBirthdaysByMonthDay[md]) clientBirthdaysByMonthDay[md] = [];
    clientBirthdaysByMonthDay[md].push((c.client_name || '').trim() || '（未命名客戶）');
  });

  selectedDate = todayStr();
  await loadMonth();
}

async function loadMonth(){
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  document.getElementById('monthLabel').textContent = `${y} 年 ${m+1} 月`;

  const rangeStart = toDateStr(new Date(y, m, 1));
  const rangeEnd = toDateStr(new Date(y, m+1, 0));

  const { data, error } = await supabaseClient
    .from('calendar_events')
    .select('*, client_records(client_name)')
    .lte('event_date', rangeEnd)
    .or(`end_date.gte.${rangeStart},and(end_date.is.null,event_date.gte.${rangeStart})`)
    // 只要「自己的行程」或「visibility=team 的團隊公告」，不要把別人的私人行程也抓進來
    // （正式的隔離是靠資料庫的 RLS 規則把關，這裡是前端多一層保險，避免顯示邏輯出錯時外洩）
    .or(`advisor_id.eq.${myId},visibility.eq.team`)
    .order('start_time', { ascending: true, nullsFirst: false });
  if(error){ console.error('讀取行事曆失敗', error); monthEvents = []; }
  else monthEvents = (data || []).filter(e => e.advisor_id === myId || e.visibility === 'team');

  // 補上團隊公告建立者的名字（顯示「是誰發的公告」用）
  const otherIds = [...new Set(monthEvents.filter(e=>e.advisor_id!==myId).map(e=>e.advisor_id))];
  let nameMap = {};
  if(otherIds.length){
    const { data: profiles } = await supabaseClient.from('profiles').select('id, display_name').in('id', otherIds);
    (profiles||[]).forEach(p=>{ nameMap[p.id] = p.display_name || '（未命名顧問）'; });
  }
  monthEvents.forEach(e=>{ e._ownerName = e.advisor_id===myId ? null : (nameMap[e.advisor_id] || '（未命名顧問）'); });

  renderGrid();
  renderDayPanel();
}

function eventKind(e){
  if(e.advisor_id === myId) return 'mine';
  return 'teamshared'; // 能被抓到這裡代表一定是 visibility=team 的團隊公告（見 loadMonth 的過濾邏輯）
}
function eventCoversDate(e, dateStr){
  const end = e.end_date || e.event_date;
  return e.event_date <= dateStr && end >= dateStr;
}

function birthdaysOnDate(dateStr){
  return clientBirthdaysByMonthDay[dateStr.slice(5)] || [];
}

function renderGrid(){
  const grid = document.getElementById('calGrid');
  const y = currentMonth.getFullYear(), m = currentMonth.getMonth();
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();

  let html = ['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  const cells = [];
  for(let i=0;i<firstDow;i++){
    cells.push({ day: daysInPrevMonth - firstDow + 1 + i, outside:true });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ day:d, outside:false, dateStr: toDateStr(new Date(y,m,d)) });
  }
  while(cells.length % 7 !== 0){
    cells.push({ day: cells.length - firstDow - daysInMonth + 1, outside:true });
  }

  const t = todayStr();
  cells.forEach(c=>{
    if(c.outside){
      html += `<div class="cal-cell outside"><div class="d-num">${c.day}</div></div>`;
      return;
    }
    const dayEvents = monthEvents.filter(e=>eventCoversDate(e, c.dateStr));
    const dots = dayEvents.slice(0,6).map(e=>`<span class="dot ${eventKind(e)}"></span>`).join('');
    const birthdayNames = birthdaysOnDate(c.dateStr);
    const birthdayDot = birthdayNames.length ? `<span class="dot birthday" title="生日"></span>` : '';
    const holidayName = TW_HOLIDAYS[c.dateStr];
    const cls = ['cal-cell'];
    if(c.dateStr === t) cls.push('today');
    if(c.dateStr === selectedDate) cls.push('selected');
    html += `<div class="${cls.join(' ')}" data-date="${c.dateStr}">
      <div class="d-num${holidayName?' holiday':''}">${c.day}</div>
      ${holidayName ? `<div class="d-holiday-label">${holidayName}</div>` : ''}
      <div class="d-dots">${dots}${birthdayDot}</div>
    </div>`;
  });

  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedDate = cell.dataset.date;
      renderGrid();
      renderDayPanel();
    });
  });
}

function formatTimeRange(e){
  const md = iso => { const d = new Date(iso+'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}`; };
  const multiDay = e.end_date && e.end_date !== e.event_date;
  const rangeText = multiDay ? `${md(e.event_date)}–${md(e.end_date)}　` : '';
  if(!e.start_time) return rangeText + (multiDay ? '全天' : '');
  const cut = t => t ? t.slice(0,5) : '';
  return rangeText + (e.end_time ? `${cut(e.start_time)}–${cut(e.end_time)}` : cut(e.start_time));
}

function renderDayPanel(){
  if(!selectedDate) return;
  const d = new Date(selectedDate + 'T00:00:00');
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  const holidayName = TW_HOLIDAYS[selectedDate];
  document.getElementById('dayPanelTitle').textContent =
    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（週${wd}）` + (holidayName ? `　·　${holidayName}` : '');

  const dayEvents = monthEvents.filter(e=>eventCoversDate(e, selectedDate))
    .sort((a,b)=> (a.start_time||'99').localeCompare(b.start_time||'99'));
  const birthdayNames = birthdaysOnDate(selectedDate);
  const birthdayRowsHTML = birthdayNames.map(name => `
    <div class="event-row">
      <span class="e-badge birthday"></span>
      <div class="e-body">
        <div class="e-title">🎂 ${escapeHtml(name)} 生日快樂</div>
      </div>
    </div>`).join('');

  const list = document.getElementById('dayEventList');
  if(dayEvents.length===0 && birthdayNames.length===0){
    list.innerHTML = '<div class="empty-day">這天還沒有安排任何事件</div>';
    return;
  }
  list.innerHTML = birthdayRowsHTML + dayEvents.map(e=>{
    const kind = eventKind(e);
    const isMine = kind === 'mine';
    const ownerLine = kind==='teamshared' ? `${e._ownerName} · 團隊公告` : '';
    const clientLine = e.client_records ? `👤 ${e.client_records.client_name || '（未命名客戶）'}` : '';
    return `
    <div class="event-row">
      <span class="e-badge ${kind}"></span>
      <div class="e-body">
        <div class="e-title">${e.series_id ? '🔁 ' : ''}${escapeHtml(e.title)}</div>
        <div class="e-meta">${[formatTimeRange(e), clientLine].filter(Boolean).join('　')}</div>
        ${e.description ? `<div class="e-meta">${escapeHtml(e.description)}</div>` : ''}
        ${ownerLine ? `<div class="e-owner">${ownerLine}</div>` : ''}
      </div>
      ${isMine ? `<div class="e-actions"><button data-edit="${e.id}">✎</button></div>` : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const e = monthEvents.find(x=>x.id===btn.dataset.edit);
      if(e) openEventModal(e);
    });
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ---------------- 新增／編輯事件 modal ---------------- */
const eventOverlay = document.getElementById('eventOverlay');

function toggleTimeRow(){
  const allDay = document.getElementById('fieldAllDay').checked;
  document.getElementById('timeFieldRow').style.display = allDay ? 'none' : 'grid';
  if(allDay){
    document.getElementById('fieldStart').value = '';
    document.getElementById('fieldEnd').value = '';
  }
}
document.getElementById('fieldAllDay').addEventListener('change', toggleTimeRow);

function toggleRecurringOptions(){
  document.getElementById('recurringOptions').style.display =
    document.getElementById('fieldRecurring').checked ? 'grid' : 'none';
}
document.getElementById('fieldRecurring').addEventListener('change', toggleRecurringOptions);

function openEventModal(existing){
  document.getElementById('eventModalTitle').textContent = existing ? '編輯事件' : '新增事件';
  document.getElementById('eventId').value = existing ? existing.id : '';
  document.getElementById('fieldTitle').value = existing ? existing.title : '';
  document.getElementById('fieldDate').value = existing ? existing.event_date : selectedDate;
  document.getElementById('fieldEndDate').value = existing ? (existing.end_date || existing.event_date) : selectedDate;
  document.getElementById('fieldStart').value = existing && existing.start_time ? existing.start_time.slice(0,5) : '';
  document.getElementById('fieldEnd').value = existing && existing.end_time ? existing.end_time.slice(0,5) : '';
  document.getElementById('fieldAllDay').checked = !!(existing && !existing.start_time);
  toggleTimeRow();
  document.getElementById('fieldClient').value = existing && existing.client_id ? existing.client_id : '';
  document.getElementById('fieldDesc').value = existing ? (existing.description || '') : '';
  document.getElementById('fieldVisibility').checked = !!(existing && existing.visibility === 'team');
  document.getElementById('btnDeleteEvent').style.display = existing ? 'inline-block' : 'none';
  // 週期性設定只在「新增」的時候提供，編輯既有事件（包括週期性事件的其中一筆）一律當成單筆處理
  document.getElementById('recurringField').style.display = existing ? 'none' : 'block';
  document.getElementById('fieldRecurring').checked = false;
  document.getElementById('fieldRecurInterval').value = '1';
  const defaultUntil = new Date(selectedDate + 'T00:00:00'); defaultUntil.setMonth(defaultUntil.getMonth()+3);
  document.getElementById('fieldRecurUntil').value = toDateStr(defaultUntil);
  toggleRecurringOptions();
  // 週期性事件是 Pro 以上方案的功能，Free 方案只能新增單筆事件（用灰階呈現，不額外顯示文字說明）
  const canRecur = TIER_RANK[myPlan] >= TIER_RANK.pro;
  document.getElementById('fieldRecurring').disabled = !canRecur;
  document.getElementById('recurringToggleLabel').classList.toggle('is-disabled', !canRecur);
  eventOverlay.classList.add('show');
}
function closeEventModal(){ eventOverlay.classList.remove('show'); }

document.getElementById('btnAddEvent').addEventListener('click', ()=> openEventModal(null));
document.getElementById('btnCancelEvent').addEventListener('click', closeEventModal);
eventOverlay.addEventListener('click', (e)=>{ if(e.target.id==='eventOverlay') closeEventModal(); });

function makeSeriesId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'series-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

document.getElementById('btnSaveEvent').addEventListener('click', async ()=>{
  const title = document.getElementById('fieldTitle').value.trim();
  if(!title){ alert('請輸入標題'); return; }
  const id = document.getElementById('eventId').value;
  const startDate = document.getElementById('fieldDate').value;
  let endDate = document.getElementById('fieldEndDate').value || startDate;
  if(!startDate){ alert('請選擇開始日期'); return; }
  if(endDate < startDate){ alert('結束日期不能早於開始日期'); return; }
  const allDay = document.getElementById('fieldAllDay').checked;
  // 週期性事件僅 Pro 以上方案開放；就算前端checkbox被繞過，這裡也再擋一次
  const canRecur = TIER_RANK[myPlan] >= TIER_RANK.pro;
  const isRecurring = !id && canRecur && document.getElementById('fieldRecurring').checked;
  // 團隊公告僅 Master 方案開放
  const canAnnounce = isTeamOwner && TIER_RANK[myPlan] >= TIER_RANK.master;

  const basePayload = {
    advisor_id: myId,
    title,
    start_time: allDay ? null : (document.getElementById('fieldStart').value || null),
    end_time: allDay ? null : (document.getElementById('fieldEnd').value || null),
    client_id: document.getElementById('fieldClient').value || null,
    description: document.getElementById('fieldDesc').value.trim() || null,
    visibility: (canAnnounce && document.getElementById('fieldVisibility').checked) ? 'team' : 'private'
  };

  let error;
  if(isRecurring){
    const interval = Math.max(1, parseInt(document.getElementById('fieldRecurInterval').value, 10) || 1);
    const until = document.getElementById('fieldRecurUntil').value;
    if(!until){ alert('請選擇週期性事件要重複到哪一天'); return; }
    const seriesId = makeSeriesId();
    const rows = [];
    let cursor = new Date(startDate + 'T00:00:00');
    const untilD = new Date(until + 'T00:00:00');
    const MAX_OCCURRENCES = 104; // 安全上限，避免不小心設太久生出海量資料
    let count = 0;
    while(cursor <= untilD && count < MAX_OCCURRENCES){
      const dateStr = toDateStr(cursor);
      rows.push({ ...basePayload, event_date: dateStr, end_date: dateStr, series_id: seriesId });
      cursor.setDate(cursor.getDate() + interval*7);
      count++;
    }
    if(rows.length===0){ alert('週期性事件的結束日期要晚於開始日期'); return; }
    ({ error } = await supabaseClient.from('calendar_events').insert(rows));
  } else {
    const payload = { ...basePayload, event_date: startDate, end_date: endDate };
    if(id){
      ({ error } = await supabaseClient.from('calendar_events').update(payload).eq('id', id));
    } else {
      ({ error } = await supabaseClient.from('calendar_events').insert(payload));
    }
  }
  if(error){ console.error('儲存事件失敗', error); alert('儲存失敗，請檢查網路連線後再試一次。'); return; }

  closeEventModal();
  await loadMonth();
});

document.getElementById('btnDeleteEvent').addEventListener('click', async ()=>{
  const id = document.getElementById('eventId').value;
  if(!id) return;
  if(!confirm('確定要刪除這筆事件嗎？這個動作沒辦法復原。')) return;
  const { error } = await supabaseClient.from('calendar_events').delete().eq('id', id);
  if(error){ console.error('刪除事件失敗', error); alert('刪除失敗，請檢查網路連線後再試一次。'); return; }
  closeEventModal();
  await loadMonth();
});

document.getElementById('btnPrevMonth').addEventListener('click', ()=>{
  currentMonth.setMonth(currentMonth.getMonth()-1);
  loadMonth();
});
document.getElementById('btnNextMonth').addEventListener('click', ()=>{
  currentMonth.setMonth(currentMonth.getMonth()+1);
  loadMonth();
});
document.getElementById('btnToday').addEventListener('click', ()=>{
  currentMonth = new Date(); currentMonth.setDate(1);
  selectedDate = todayStr();
  loadMonth();
});

init();
</script>
