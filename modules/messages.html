<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訊息</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73; --teal-tint:#E6F0F2; --teal-light-text:#BFE0EA;
    --warm:#C97B3D; --warm-deep:#A85F27; --warm-tint:#FBEFE2;
    --paper:#F5F7F6; --card:#FFFFFF; --ink:#182226; --ink-soft:#5B6B70; --line:#E1E7E7;
    --negative:#B3492F; --positive:#2E7D5B; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC",sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  h1,h2,h3{font-family:"Noto Serif TC",serif; margin:0; color:var(--navy);}

  header.hero{
    background:linear-gradient(135deg,var(--navy) 0%,var(--teal-deep) 60%,var(--teal) 100%);
    color:#fff; padding:20px 28px; flex-shrink:0;
  }
  header.hero .eyebrow{font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--teal-light-text); font-weight:700; margin-bottom:6px;}
  header.hero h1{color:#fff; font-size:19px; font-weight:700;}

  .team-switch{padding:10px 28px; background:var(--card); border-bottom:1px solid var(--line); flex-shrink:0;}
  .team-switch select{
    padding:7px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:13px;
    font-family:"Noto Sans TC",sans-serif; color:var(--navy); background:var(--paper);
  }

  .msg-shell{flex:1; display:flex; min-height:0;}

  aside.contacts{
    width:260px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .contacts-head{
    font-family:"Roboto Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-soft); padding:14px 18px 8px;
  }
  .contact-item{
    display:flex; align-items:center; gap:10px; padding:11px 16px; cursor:pointer;
    border-left:3px solid transparent;
  }
  .contact-item:hover{background:var(--paper);}
  .contact-item.active{background:var(--teal-tint); border-left-color:var(--teal);}
  .contact-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0; background:linear-gradient(135deg,var(--teal) 0%,var(--teal-light-text) 100%);
    color:var(--navy); font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif TC",serif; background-size:cover; background-position:center;
  }
  .contact-info{flex:1; min-width:0;}
  .contact-name{font-size:13.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px;}
  .contact-preview{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
  .unread-dot{
    background:var(--negative); color:#fff; font-size:10px; font-weight:700; border-radius:10px;
    min-width:17px; height:17px; display:flex; align-items:center; justify-content:center; padding:0 4px; flex-shrink:0;
  }
  .contacts-empty{padding:20px 18px; font-size:12.5px; color:var(--ink-soft); line-height:1.8;}

  section.chat-panel{flex:1; display:flex; flex-direction:column; min-width:0;}
  .chat-empty{
    flex:1; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:13px; text-align:center; padding:20px;
  }
  .chat-active{flex:1; display:none; flex-direction:column; min-height:0;}
  .chat-header{
    display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--line);
    background:var(--card); flex-shrink:0; font-weight:700; color:var(--navy); font-size:14px;
  }
  .btn-back-contacts{display:none; background:none; border:none; color:var(--teal-deep); font-size:16px; cursor:pointer; padding:0;}

  .chat-messages{flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:10px;}
  .msg-row{display:flex;}
  .msg-row.me{justify-content:flex-end;}
  .msg-bubble{
    max-width:66%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.6;
    background:var(--paper); color:var(--ink); word-wrap:break-word;
  }
  .msg-row.me .msg-bubble{background:var(--teal); color:#fff;}
  .msg-bubble img{max-width:220px; border-radius:10px; display:block; cursor:pointer;}
  .msg-time{font-size:10px; color:var(--ink-soft); margin-top:3px; text-align:right; display:flex; align-items:center; justify-content:flex-end; gap:6px;}
  .msg-row.me .msg-time{color:rgba(255,255,255,0.7);}
  .msg-recall-btn{background:none; border:none; padding:0; font-size:10px; color:inherit; opacity:.75; cursor:pointer; font-family:"Noto Sans TC",sans-serif; text-decoration:underline;}
  .msg-recall-btn:hover{opacity:1;}
  .msg-bubble.recalled{font-style:italic; opacity:.7;}

  .chat-input-row{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--line); background:var(--card); flex-shrink:0;}
  .chat-input-row input[type=text]{
    flex:1; padding:10px 14px; border:1.5px solid var(--line); border-radius:20px; font-size:13.5px;
    font-family:"Noto Sans TC",sans-serif;
  }
  .chat-input-row input[type=text]:focus{outline:none; border-color:var(--teal);}
  .chat-icon-btn{
    background:none; border:none; font-size:19px; cursor:pointer; color:var(--ink-soft); padding:4px;
    flex-shrink:0;
  }
  .chat-icon-btn:hover{color:var(--teal-deep);}
  .btn-send{
    background:var(--navy); color:#fff; border:none; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:700; cursor:pointer; flex-shrink:0; font-family:"Noto Sans TC",sans-serif;
  }
  .btn-send:hover{background:var(--teal-deep);}
  .btn-send:disabled{opacity:.5; cursor:default;}

  @media (max-width:720px){
    aside.contacts{
      width:100%; position:absolute; inset:0; z-index:5;
    }
    section.chat-panel{position:absolute; inset:0; z-index:6; display:none; background:var(--card);}
    .msg-shell{position:relative;}
    body.mobile-chat-open aside.contacts{display:none;}
    body.mobile-chat-open section.chat-panel{display:flex;}
    .btn-back-contacts{display:inline-block;}
    .msg-bubble{max-width:80%;}
  }
</style>
</head>
<body>
<script>
// 保險機制：這個頁面不管出什麼錯，畫面一定要顯示看得懂的紅字說明，不會再讓妳看到一片空白猜不出原因
window.addEventListener('error', function(e){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;background:#fff;color:#B3492F;padding:20px;font-family:sans-serif;font-size:13px;line-height:1.8;overflow:auto;z-index:99999;white-space:pre-wrap;';
  box.textContent = '訊息頁面載入時發生錯誤：\n' + (e.message || (e.error && e.error.message) || String(e)) + '\n\n（檔案：' + (e.filename||'') + ' 第 ' + (e.lineno||'?') + ' 行）';
  document.body.appendChild(box);
});
window.addEventListener('unhandledrejection', function(e){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;background:#fff;color:#B3492F;padding:20px;font-family:sans-serif;font-size:13px;line-height:1.8;overflow:auto;z-index:99999;white-space:pre-wrap;';
  const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  box.textContent = '訊息頁面連線／執行時發生錯誤：\n' + reason;
  document.body.appendChild(box);
});
// 10 秒後如果連線還是卡住（一直沒進到聊天畫面），顯示提示而不是放著空白
setTimeout(function(){
  if(!window.__vicauriaMsgLoaded){
    const box = document.createElement('div');
    box.id = 'vicauriaTimeoutHint';
    box.style.cssText = 'position:fixed; left:12px; right:12px; bottom:12px; background:#FBEFE2; color:#A85F27; padding:10px 14px; border-radius:8px; font-size:12px; font-family:sans-serif; z-index:99998;';
    box.textContent = '（如果一直看不到聯絡人清單，可能是網路連線問題，或畫面需要重新整理一次。）';
    document.body.appendChild(box);
  }
}, 10000);
</script>

<div class="team-switch" id="teamSwitchWrap" style="display:none;">
  <select id="teamSwitchSelect"></select>
</div>

<div class="msg-shell">
  <aside class="contacts">
    <div class="contacts-head">同團隊夥伴</div>
    <div id="contactsList"><div class="contacts-empty">載入中…</div></div>
  </aside>
  <section class="chat-panel">
    <div class="chat-empty" id="chatEmpty">選一位同事開始聊天</div>
    <div class="chat-active" id="chatActive">
      <div class="chat-header">
        <button class="btn-back-contacts" id="btnBackContacts">‹</button>
        <span id="chatHeaderName"></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
        <button type="button" class="chat-icon-btn" id="btnAttachPhoto" title="傳照片">📷</button>
        <input type="text" id="chatTextInput" placeholder="輸入訊息…" autocomplete="off">
        <button class="btn-send" id="btnSend">送出</button>
      </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../theme-config.js"></script>
<script>
jkApplySavedTheme();

let myUserId = null;
let myTeams = [];
let currentTeamId = null;
let contacts = [];
let activeContact = null;
let activeConversation = null;
let currentChannel = null;
let stickToBottom = true; // 是否要一直貼在最底部（剛開對話、或使用者本來就停在最底下時，收到新內容要自動跟著捲到底）
const signedUrlCache = new Map();

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

async function getSignedUrl(path){
  if(signedUrlCache.has(path)) return signedUrlCache.get(path);
  const { data, error } = await supabaseClient.storage.from('chat-images').createSignedUrl(path, 14400);
  if(error){ console.error('取得照片連結失敗', error); return null; }
  signedUrlCache.set(path, data.signedUrl);
  return data.signedUrl;
}

/* ---------------- 團隊解析：主管自己的團隊 + 有加入的團隊，兩種都算 ---------------- */
async function resolveMyTeams(){
  const teams = [];
  const { data: owned } = await supabaseClient.from('teams').select('id, name').eq('owner_id', myUserId).maybeSingle();
  if(owned) teams.push({ id: owned.id, name: owned.name || '我的團隊' });
  const { data: joined } = await supabaseClient.from('team_members').select('team_id, teams(name)').eq('advisor_id', myUserId);
  (joined||[]).forEach(r=>{ if(r.team_id) teams.push({ id: r.team_id, name: r.teams?.name || '團隊' }); });
  return teams;
}

async function initTeams(){
  myTeams = await resolveMyTeams();
  if(myTeams.length === 0){
    document.getElementById('chatEmpty').textContent = '你目前還沒有加入任何團隊，請先到「團隊」頁面建立或加入團隊。';
    document.getElementById('contactsList').innerHTML = '<div class="contacts-empty">還沒有團隊夥伴。</div>';
    return;
  }
  if(myTeams.length > 1){
    const wrap = document.getElementById('teamSwitchWrap');
    wrap.style.display = 'block';
    const sel = document.getElementById('teamSwitchSelect');
    sel.innerHTML = myTeams.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
    sel.addEventListener('change', ()=>{
      currentTeamId = sel.value;
      activeContact = null; activeConversation = null;
      document.getElementById('chatEmpty').style.display = 'flex';
      document.getElementById('chatActive').style.display = 'none';
      loadContactsAndConversations();
    });
  }
  currentTeamId = myTeams[0].id;
  await loadContactsAndConversations();
}

/* ---------------- 聯絡人清單＋每個人的最新訊息/未讀數 ---------------- */
async function loadContactsAndConversations(){
  const { data: members, error } = await supabaseClient.rpc('get_team_members', { p_team_id: currentTeamId });
  if(error){ console.error('讀取團隊成員失敗', error); return; }
  contacts = (members||[]).filter(m=>m.advisor_id !== myUserId);

  const { data: convos } = await supabaseClient.from('direct_conversations')
    .select('*').eq('team_id', currentTeamId).or(`participant_a.eq.${myUserId},participant_b.eq.${myUserId}`);

  const convoIds = (convos||[]).map(c=>c.id);
  const lastMsgMap = {}, unreadMap = {};
  if(convoIds.length){
    const { data: msgs } = await supabaseClient.from('direct_messages')
      .select('*').in('conversation_id', convoIds).order('created_at', { ascending: true });
    (msgs||[]).forEach(m=>{
      lastMsgMap[m.conversation_id] = m; // 依時間升冪跑過去，最後留下的就是最新一筆
      if(m.sender_id !== myUserId && !m.read_at && !m.deleted_at){
        unreadMap[m.conversation_id] = (unreadMap[m.conversation_id]||0) + 1;
      }
    });
  }

  contacts.forEach(c=>{
    const convo = (convos||[]).find(v => v.participant_a === c.advisor_id || v.participant_b === c.advisor_id);
    c._convo = convo || null;
    c._lastMsg = convo ? lastMsgMap[convo.id] : null;
    c._unread = convo ? (unreadMap[convo.id]||0) : 0;
  });
  contacts.sort((a,b)=>{
    const at = a._lastMsg ? new Date(a._lastMsg.created_at).getTime() : 0;
    const bt = b._lastMsg ? new Date(b._lastMsg.created_at).getTime() : 0;
    return bt - at;
  });
  // 清單重新載入後，把「目前打開的對話對象」指向新的那筆資料，後續的未讀數更新才會反映在畫面上
  if(activeContact){
    const fresh = contacts.find(c=>c.advisor_id === activeContact.advisor_id);
    if(fresh){ fresh._convo = fresh._convo || activeContact._convo; activeContact = fresh; }
  }
  renderContacts();
}

function renderContacts(){
  const list = document.getElementById('contactsList');
  if(contacts.length === 0){
    list.innerHTML = '<div class="contacts-empty">目前團隊裡還沒有其他夥伴。</div>';
    return;
  }
  list.innerHTML = contacts.map(c=>{
    const preview = c._lastMsg ? (c._lastMsg.deleted_at ? '訊息已收回' : (c._lastMsg.content || '[照片]')) : '還沒有對話';
    const initial = (c.display_name||'?').charAt(0).toUpperCase();
    const avatarStyle = c.avatar_url ? `background-image:url(${c.avatar_url})` : '';
    return `
      <div class="contact-item${activeContact && activeContact.advisor_id===c.advisor_id ? ' active':''}" data-id="${c.advisor_id}">
        <div class="contact-avatar" style="${avatarStyle}">${c.avatar_url ? '' : initial}</div>
        <div class="contact-info">
          <div class="contact-name">${c.display_name}</div>
          <div class="contact-preview">${preview}</div>
        </div>
        ${c._unread>0 ? `<div class="unread-dot">${c._unread}</div>` : ''}
      </div>
    `;
  }).join('');
  list.querySelectorAll('.contact-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const contact = contacts.find(c=>c.advisor_id === el.dataset.id);
      if(contact) openConversation(contact);
    });
  });
}

/* ---------------- 對話：開啟／建立、載入訊息、即時訂閱 ---------------- */
async function getOrCreateConversation(teamId, otherId){
  const [a,b] = myUserId < otherId ? [myUserId, otherId] : [otherId, myUserId];
  let { data: convo } = await supabaseClient.from('direct_conversations')
    .select('*').eq('team_id', teamId).eq('participant_a', a).eq('participant_b', b).maybeSingle();
  if(!convo){
    const { data: created, error } = await supabaseClient.from('direct_conversations')
      .insert({ team_id: teamId, participant_a: a, participant_b: b }).select('*').single();
    if(error){ console.error('建立對話失敗', error); return null; }
    convo = created;
  }
  return convo;
}

function scrollChatToBottom(){
  const box = document.getElementById('chatMessages');
  box.scrollTop = box.scrollHeight;
}

// 聊天視窗捲動時，判斷使用者是不是還停在最底部附近；如果自己往上捲去看舊訊息，
// 之後新訊息／照片載入就不要再硬把畫面拉走
document.getElementById('chatMessages').addEventListener('scroll', ()=>{
  const box = document.getElementById('chatMessages');
  stickToBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;
});

function appendMessage(m){
  const box = document.getElementById('chatMessages');
  const row = document.createElement('div');
  row.className = 'msg-row' + (m.sender_id === myUserId ? ' me' : '');
  row.dataset.msgId = m.id;
  row.dataset.createdAt = m.created_at;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if(m.deleted_at){
    bubble.classList.add('recalled');
    const p = document.createElement('div');
    p.textContent = '訊息已收回';
    bubble.appendChild(p);
  } else {
    if(m.content){
      const p = document.createElement('div');
      p.textContent = m.content;
      bubble.appendChild(p);
    }
    if(m.image_url){
      const img = document.createElement('img');
      img.alt = '照片';
      bubble.appendChild(img);
      img.addEventListener('load', ()=>{ if(stickToBottom) scrollChatToBottom(); }); // 照片是非同步載入的，載完圖片框變高之後要再貼回底部一次，不然會停在照片載入前的位置
      getSignedUrl(m.image_url).then(url=>{
        if(url){ img.src = url; img.addEventListener('click', ()=> window.open(url, '_blank')); }
      });
    }
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  const timeText = document.createElement('span');
  timeText.textContent = fmtTime(m.created_at);
  time.appendChild(timeText);
  if(m.sender_id === myUserId && !m.deleted_at){
    const recallBtn = document.createElement('button');
    recallBtn.className = 'msg-recall-btn';
    recallBtn.textContent = '收回';
    recallBtn.dataset.recallMsg = m.id;
    time.appendChild(recallBtn);
  }
  bubble.appendChild(time);
  row.appendChild(bubble);
  box.appendChild(row);
}

// 把某一則訊息在畫面上改成「已收回」的樣子（自己收回、或對方收回時即時更新）
function markMessageRecalled(msgId){
  const row = document.querySelector(`.msg-row[data-msg-id="${msgId}"]`);
  if(!row) return;
  const bubble = row.querySelector('.msg-bubble');
  if(!bubble) return;
  bubble.classList.add('recalled');
  bubble.innerHTML = '';
  const p = document.createElement('div');
  p.textContent = '訊息已收回';
  bubble.appendChild(p);
  const time = document.createElement('div');
  time.className = 'msg-time';
  const timeText = document.createElement('span');
  timeText.textContent = fmtTime(row.dataset.createdAt);
  time.appendChild(timeText);
  bubble.appendChild(time);
}

document.getElementById('chatMessages').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-recall-msg]');
  if(!btn) return;
  if(!confirm('確定要收回這則訊息嗎？')) return;
  const msgId = btn.dataset.recallMsg;
  const { error } = await supabaseClient.from('direct_messages')
    .update({ deleted_at: new Date().toISOString() }).eq('id', msgId).eq('sender_id', myUserId);
  if(error){ console.error('收回失敗', error); alert('收回失敗，請稍後再試。'); return; }
  markMessageRecalled(msgId);
});

/* ---------------- 這個聊天畫面現在「真的有人在看」嗎？ ----------------
   這個頁面會被放在工作台右下角的浮動聊天視窗裡，視窗「關起來」時其實只是被藏起來，頁面還活著、
   還在接收即時訊息。以前不管有沒有人在看，收到訊息就直接標成已讀，
   結果對方傳來的訊息在視窗關著時就被偷偷標成已讀，泡泡上的未讀提醒永遠跳不出來。
   現在只有真的看得到的時候才標已讀。 */
function isChatVisible(){
  if(document.visibilityState !== 'visible') return false;
  try{
    const fe = window.frameElement;
    if(fe){
      const floatPanel = fe.closest('.float-chat-panel');
      if(floatPanel && !floatPanel.classList.contains('open')) return false;
    }
  }catch(e){}
  return true;
}

// 把目前打開的這個對話裡，對方傳來、還沒讀的訊息全部標成已讀（工作台打開浮動視窗時也會呼叫這個）
window.markActiveConversationRead = async function(){
  if(!activeConversation || !myUserId) return;
  await supabaseClient.from('direct_messages')
    .update({ read_at: new Date().toISOString() })
    .eq('conversation_id', activeConversation.id)
    .neq('sender_id', myUserId)
    .is('read_at', null);
  if(activeContact && activeContact._unread){ activeContact._unread = 0; renderContacts(); }
};
document.addEventListener('visibilitychange', ()=>{
  if(isChatVisible()) window.markActiveConversationRead();
});

function subscribeToConversation(convoId){
  if(currentChannel){ supabaseClient.removeChannel(currentChannel); currentChannel = null; }
  currentChannel = supabaseClient.channel(`dm-${convoId}`)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'direct_messages', filter:`conversation_id=eq.${convoId}` }, payload=>{
      const msg = payload.new;
      if(msg.sender_id === myUserId) return; // 自己送出的訊息送出當下就已經畫面上加過了
      appendMessage(msg);
      if(stickToBottom) scrollChatToBottom();
      if(activeContact){ activeContact._lastMsg = msg; }
      if(isChatVisible()){
        supabaseClient.from('direct_messages').update({ read_at: new Date().toISOString() }).eq('id', msg.id).then(()=>{});
        renderContacts();
      } else if(activeContact){
        activeContact._unread = (activeContact._unread||0) + 1;
        renderContacts();
      }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'direct_messages', filter:`conversation_id=eq.${convoId}` }, payload=>{
      const msg = payload.new;
      if(msg.deleted_at) markMessageRecalled(msg.id); // 對方把訊息收回時，畫面上也要即時變成「已收回」
    })
    .subscribe();
}

async function openConversation(contact){
  activeContact = contact;
  document.querySelectorAll('.contact-item').forEach(el=> el.classList.toggle('active', el.dataset.id===contact.advisor_id));

  let convo = contact._convo;
  if(!convo){
    convo = await getOrCreateConversation(currentTeamId, contact.advisor_id);
    contact._convo = convo;
  }
  if(!convo) return;
  activeConversation = convo;

  document.getElementById('chatEmpty').style.display = 'none';
  document.getElementById('chatActive').style.display = 'flex';
  document.getElementById('chatHeaderName').textContent = contact.display_name;
  document.getElementById('chatMessages').innerHTML = '';
  stickToBottom = true; // 每次打開一個對話，都先預設要停在最新（未讀）訊息那邊，而不是從最上面看起

  const { data: msgs } = await supabaseClient.from('direct_messages')
    .select('*').eq('conversation_id', convo.id).order('created_at', { ascending: true });
  (msgs||[]).forEach(appendMessage);
  scrollChatToBottom();
  // 文字訊息馬上就能量到正確高度，但照片要等載入後才知道實際高度，
  // 所以再多補幾次捲動，確保最後真的停在最底部（最新／未讀訊息）而不是卡在中間
  requestAnimationFrame(scrollChatToBottom);
  setTimeout(scrollChatToBottom, 150);
  setTimeout(scrollChatToBottom, 500);

  const unreadIds = (msgs||[]).filter(m=> m.sender_id!==myUserId && !m.read_at).map(m=>m.id);
  if(unreadIds.length){
    await supabaseClient.from('direct_messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds);
    contact._unread = 0;
    renderContacts();
    document.querySelectorAll('.contact-item').forEach(el=> el.classList.toggle('active', el.dataset.id===contact.advisor_id));
  }

  subscribeToConversation(convo.id);
  document.body.classList.add('mobile-chat-open');
}

document.getElementById('btnBackContacts').addEventListener('click', ()=>{
  document.body.classList.remove('mobile-chat-open');
});

/* ---------------- 送出訊息（文字／照片） ---------------- */
async function sendText(){
  const input = document.getElementById('chatTextInput');
  const text = input.value.trim();
  if(!text || !activeConversation) return;
  input.value = '';
  const { data, error } = await supabaseClient.from('direct_messages')
    .insert({ conversation_id: activeConversation.id, sender_id: myUserId, content: text }).select('*').single();
  if(error){ console.error('傳送失敗', error); alert('傳送失敗，請再試一次。'); return; }
  appendMessage(data);
  scrollChatToBottom();
  if(activeContact){ activeContact._lastMsg = data; renderContacts(); }
}
document.getElementById('btnSend').addEventListener('click', sendText);
document.getElementById('chatTextInput').addEventListener('keydown', (e)=>{
  // 注意：用注音／拼音等輸入法打字時，選字確認也會觸發一次 Enter，
  // 這時候 e.isComposing 會是 true，要跳過，不然中文訊息會被送兩次
  if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); sendText(); }
});

document.getElementById('btnAttachPhoto').addEventListener('click', ()=>{
  if(!activeConversation){ alert('請先選一位同事開始聊天。'); return; }
  document.getElementById('photoInput').click();
});
document.getElementById('photoInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file || !activeConversation) return;
  if(!file.type.startsWith('image/')){ alert('請選擇圖片檔案。'); return; }
  if(file.size > 5*1024*1024){ alert('照片太大了，請選擇 5MB 以內的圖片。'); return; }

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${currentTeamId}/dm/${activeConversation.id}/${crypto.randomUUID()}.${ext}`;
  const btn = document.getElementById('btnAttachPhoto');
  btn.disabled = true;
  try{
    const { error: upErr } = await supabaseClient.storage.from('chat-images').upload(path, file);
    if(upErr) throw upErr;
    const { data, error } = await supabaseClient.from('direct_messages')
      .insert({ conversation_id: activeConversation.id, sender_id: myUserId, image_url: path }).select('*').single();
    if(error) throw error;
    appendMessage(data);
    scrollChatToBottom();
    if(activeContact){ activeContact._lastMsg = data; renderContacts(); }
  }catch(err){
    console.error('照片傳送失敗', err);
    alert('照片傳送失敗，請稍後再試。');
  }finally{
    btn.disabled = false;
  }
});

(async function init(){
  window.__vicauriaMsgLoaded = true; // 只要跑到這裡，代表程式碼真的有在執行、supabase 有連上，10秒提示就不用再跳出來
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    document.getElementById('contactsList').innerHTML = '<div class="contacts-empty">目前沒有偵測到登入狀態，請重新整理這個頁面，或重新登入後再試一次。</div>';
    return;
  }
  myUserId = session.user.id;
  const { data: profile } = await supabaseClient.from('profiles').select('plan').eq('id', myUserId).single();
  const myPlan = (profile && profile.plan) || 'free';
  if(myPlan === 'master'){
    const { data: team } = await supabaseClient.from('teams').select('id').eq('owner_id', myUserId).maybeSingle();
    if(!team) await supabaseClient.from('teams').insert({ owner_id: myUserId });
  }
  await initTeams();
  try{ await supabaseClient.realtime.setAuth(session.access_token); }catch(e){}
  subscribeToContactList();
})();

/* ---------------- 聯絡人清單的即時更新 ----------------
   以前只有「目前打開的那個對話」有即時訂閱，其他人傳訊息來時，左邊清單的未讀數字、最新訊息預覽都不會動，
   要重新整理才看得到。現在另外訂閱一條，別的對話有新訊息時就重新整理清單。 */
let listChannel = null, listReloadTimer = null, listRetryTimer = null;
function scheduleListReload(){
  clearTimeout(listReloadTimer);
  listReloadTimer = setTimeout(()=>{ if(currentTeamId) loadContactsAndConversations(); }, 500);
}
function subscribeToContactList(){
  clearTimeout(listRetryTimer);
  if(listChannel){ try{ supabaseClient.removeChannel(listChannel); }catch(e){} listChannel = null; }
  listChannel = supabaseClient.channel(`dm-list-${myUserId}`)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'direct_messages' }, payload=>{
      const msg = payload.new;
      if(msg.sender_id === myUserId) return;
      if(activeConversation && msg.conversation_id === activeConversation.id) return; // 目前打開的對話由上面那條訂閱處理
      scheduleListReload();
    })
    .subscribe(status=>{
      if(status === 'SUBSCRIBED'){
        scheduleListReload(); // 連上／重連上時補抓一次，斷線期間漏掉的也會補回來
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
        listRetryTimer = setTimeout(subscribeToContactList, 5000);
      }
    });
}
supabaseClient.auth.onAuthStateChange((event, s)=>{
  if(event === 'TOKEN_REFRESHED' && s){ try{ supabaseClient.realtime.setAuth(s.access_token); }catch(e){} }
});
</script>
