<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73; --teal-tint:#E6F0F2;
    --warm:#C97B3D; --warm-deep:#A85F27; --warm-tint:#FBEFE2;
    --paper:#F5F7F6; --card:#FFFFFF; --ink:#182226; --ink-soft:#4F5F64; --line:#E1E7E7;
    --negative:#B3492F; --positive:#2E7D5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:"Noto Sans TC",sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  button{font-family:inherit;}

  /* ---------- 問候列 ---------- */
  .greet{
    background:linear-gradient(135deg, var(--navy) 0%, var(--teal-deep) 70%, var(--teal) 100%);
    color:#fff; padding:20px 0; min-height:128px; display:flex; align-items:center; position:relative; overflow:hidden;
  }
  .greet::after{content:""; position:absolute; right:-80px; top:-120px; width:360px; height:360px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%); pointer-events:none;}
  .greet > .wrap{width:100%;}
  .greet-row{display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; position:relative; z-index:1;}
  .greet .date{font-family:"Roboto Mono",monospace; font-size:12px; letter-spacing:.12em; color:#BFE0EA; margin-bottom:6px;}
  .greet h1{font-family:"Noto Serif TC",serif; font-size:clamp(22px,3vw,28px); margin:0 0 6px; font-weight:700;}
  .greet .motto{font-size:13.5px; color:#DCEAEE; margin:0;}
  .greet-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .btn-primary{display:inline-flex; align-items:center; gap:8px; background:var(--warm); color:#fff; border:none; border-radius:28px;
    padding:13px 22px; font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:0 10px 24px rgba(201,123,61,0.35); transition:transform .15s, background .15s;}
  .btn-primary:hover{background:var(--warm-deep); transform:translateY(-1px);}
  .btn-ghost{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.35);
    border-radius:28px; padding:12px 18px; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}

  main.wrap{margin-top:20px; position:relative; z-index:2; padding-bottom:60px;} /* 數字卡與上方藍色標題背景之間留空隙，不黏在一起 */

  /* ---------- 今日重點數字 ---------- */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; cursor:pointer; text-align:left;
    box-shadow:0 8px 22px rgba(20,50,60,0.06); transition:transform .15s, border-color .15s; display:block; width:100%;}
  .kpi:hover{transform:translateY(-2px); border-color:var(--teal);}
  .kpi .lbl{font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .kpi .val{font-family:"Roboto Mono",monospace; font-size:28px; font-weight:700; color:var(--navy); line-height:1.25; margin-top:4px;}
  .kpi .hint{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .kpi.alert .val{color:var(--negative);}
  .kpi.alert{border-color:rgba(179,73,47,0.35);}

  /* ---------- 卡片 ---------- */
  .grid2{display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:18px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .card-head h2{font-family:"Noto Serif TC",serif; font-size:17px; color:var(--navy); margin:0;}
  .card-head .more{font-size:13px; color:var(--teal-deep); font-weight:700; background:none; border:none; cursor:pointer; padding:4px 0;}
  .card-head .more:hover{text-decoration:underline;}

  .row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:var(--paper); border-radius:8px;}
  .row .when{font-family:"Roboto Mono",monospace; font-size:12.5px; color:var(--teal-deep); font-weight:700; width:84px; flex-shrink:0;}
  .row .when.red{color:var(--negative);}
  .row .what{font-size:14px; font-weight:600; color:var(--ink); line-height:1.5;}
  .row .sub{font-size:12.5px; color:var(--ink-soft); margin-top:1px;}
  .empty{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 4px; color:var(--ink-soft); font-size:13.5px;}
  .empty .go{border:1.5px solid var(--teal); color:var(--teal-deep); background:#fff; border-radius:20px; padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .empty .go:hover{background:var(--teal); color:#fff;}

  /* ---------- 進度 ---------- */
  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .stat{background:var(--paper); border-radius:12px; padding:12px 14px;}
  .stat .lbl{font-size:12.5px; color:var(--ink-soft);}
  .stat .val{font-family:"Roboto Mono",monospace; font-size:22px; font-weight:700; color:var(--navy);}

  /* ---------- 新手清單 ---------- */
  .onboard{background:linear-gradient(135deg, var(--warm-tint), #fff); border:1px solid rgba(201,123,61,0.3);}
  .ob-bar{height:8px; border-radius:4px; background:rgba(201,123,61,0.15); overflow:hidden; margin:4px 0 14px;}
  .ob-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--warm),var(--warm-deep)); border-radius:4px; transition:width .4s ease;}
  .ob-step{display:flex; align-items:center; gap:12px; padding:9px 0; cursor:pointer;}
  .ob-step .ck{width:24px; height:24px; border-radius:50%; border:2px solid rgba(201,123,61,0.5); display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; flex-shrink:0;}
  .ob-step.done .ck{background:var(--positive); border-color:var(--positive);}
  .ob-step .tx{font-size:14px; color:var(--ink); font-weight:600;}
  .ob-step.done .tx{color:var(--ink-soft); text-decoration:line-through; font-weight:500;}
  .ob-step .arrow{margin-left:auto; color:var(--warm-deep); font-size:13px; font-weight:700;}
  .ob-step.done .arrow{display:none;}
  .ob-close{background:none; border:none; color:var(--ink-soft); font-size:12.5px; cursor:pointer; text-decoration:underline;}

  /* ---------- 所有功能 ---------- */
  .tools{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:10px;}
  .tool{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; text-align:left; width:100%;}
  .tool:hover{border-color:var(--teal);}
  .tool .ic{font-size:20px; line-height:1;}
  .tool .t{font-size:14px; font-weight:700; color:var(--navy);}

  /* ---------- 骨架（資料讀取中） ---------- */
  .sk{display:block; height:14px; border-radius:7px; background:linear-gradient(90deg,#EDF1F0 25%,#F7F9F8 50%,#EDF1F0 75%); background-size:200% 100%; animation:sk 1.2s infinite; margin:12px 4px;}
  .sk.w60{width:60%;} .sk.w80{width:80%;} .sk.w40{width:40%;}
  @keyframes sk{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
  @media (prefers-reduced-motion: reduce){ .sk{animation:none;} }

  @media (max-width:900px){ .grid2{grid-template-columns:1fr;} }
  @media (max-width:700px){
    .wrap{padding:0 16px;}
    .kpis{grid-template-columns:repeat(2,1fr); gap:10px;}
    .kpi{padding:14px;}
    .kpi .val{font-size:24px;}
    .greet{padding:20px 0;}
    .greet-actions{width:100%;}
    .btn-primary{flex:1; justify-content:center;}
  }
</style>
</head>
<body>

<header class="greet">
  <div class="wrap greet-row">
    <div>
      <div class="date" id="today"></div>
      <h1 id="hello">歡迎回來</h1>
      <p class="motto">覺醒，是看懂金錢的第一步；陪你走到底的，是故事。</p>
    </div>
    <div class="greet-actions">
      <button class="btn-primary" data-go="frame-blueprint">＋ 開始新的財富地圖</button>
      <button class="btn-ghost" data-go="frame-namelist">📋 列名單</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="kpis">
    <button class="kpi" data-go="frame-calendar"><div class="lbl">📅 今日行程</div><div class="val" id="kAgenda">–</div><div class="hint" id="kAgendaHint">筆安排</div></button>
    <button class="kpi" id="kFollowCard" data-go="frame-clientrecords"><div class="lbl">🔔 該追蹤的客戶</div><div class="val" id="kFollow">–</div><div class="hint">到期、逾期與 7 天內的安排</div></button>
    <button class="kpi" id="kPayCard" data-go="frame-contracts"><div class="lbl">💳 待繳款</div><div class="val" id="kPay">–</div><div class="hint" id="kPayHint">14 天內到期</div></button>
    <button class="kpi" data-go="frame-calendar"><div class="lbl">🎂 今天生日</div><div class="val" id="kBday">–</div><div class="hint">位客戶</div></button>
  </div>

  <div class="card onboard" id="onboard" hidden>
    <div class="card-head"><h2>🚀 新手上路：完成這 4 步就上手了</h2><button class="ob-close" id="obClose">先不用，隱藏</button></div>
    <div class="ob-bar"><i id="obBar" style="width:0%"></i></div>
    <div id="obSteps"></div>
  </div>

  <div class="grid2">
    <div>
      <div class="card">
        <div class="card-head"><h2>今天的行程</h2><button class="more" data-go="frame-calendar">行事曆 →</button></div>
        <div id="agendaList"><span class="sk w80"></span><span class="sk w60"></span></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>該聯絡的客戶（未來 7 天）</h2><button class="more" data-go="frame-calendar">行事曆 →</button></div>
        <div id="followList"><span class="sk w80"></span><span class="sk w40"></span></div>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="card-head"><h2>我的進度</h2><button class="more" data-go="frame-clientrecords">看全部 →</button></div>
        <div class="stats">
          <div class="stat"><div class="lbl">本月產出報告</div><div class="val" id="sReports">–</div></div>
          <div class="stat"><div class="lbl">客戶總數</div><div class="val" id="sClients">–</div></div>
          <div class="stat"><div class="lbl">提案中</div><div class="val" id="sProposal">–</div></div>
          <div class="stat"><div class="lbl">已成交</div><div class="val" id="sClosed">–</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>待繳提醒</h2><button class="more" data-go="frame-contracts">簽約管理 →</button></div>
        <div id="payList"><span class="sk w80"></span><span class="sk w60"></span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>所有功能</h2></div>
    <div class="tools" id="toolsGrid"></div>
  </div>
</main>

<script src="../vendor/supabase-js-2.117.2.js"></script>
<script src="../supabase-config.js"></script>
<script>
// 資安：把使用者／外部資料放進畫面前先轉義，避免被塞入惡意程式碼（XSS）
function vcEsc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function go(target){
  if(window.parent && typeof window.parent.goToModule === 'function') window.parent.goToModule(target);
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-go]');
  if(el) go(el.dataset.go);
});

const TOOLS = [
  ['frame-namelist','📋','名單管理'], ['frame-blueprint','🗺️','財富地圖'], ['frame-clientrecords','🗂️','客戶資料'],
  ['frame-contracts','📝','簽約管理'], ['frame-calendar','📅','行事曆'], ['frame-team','👥','團隊'],
  ['frame-simulation','🎯','沙盤推演必勝'], ['frame-cashflow','💧','收支現金流'], ['frame-balance','⚖️','資產負債表'],
  ['frame-loan','🏦','貸款試算室'], ['frame-efficiency','🔥','資金效率健檢'], ['frame-marketnews','📰','市場快訊'],
  ['frame-marketoverview','📊','市場概況'], ['frame-guide','🧭','使用導覽'], ['frame-feedback','📮','意見箱']
];
document.getElementById('toolsGrid').innerHTML = TOOLS.map(t=>`<button class="tool" data-go="${t[0]}"><span class="ic">${t[1]}</span><span class="t">${t[2]}</span></button>`).join('');

const pad = n => String(n).padStart(2,'0');
const now = new Date();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const todayMD = `${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const monthStart = `${now.getFullYear()}-${pad(now.getMonth()+1)}-01`;
document.getElementById('today').textContent = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}（${['日','一','二','三','四','五','六'][now.getDay()]}）`;

function greetWord(){
  const h = now.getHours();
  return h < 5 ? '夜深了' : h < 11 ? '早安' : h < 18 ? '午安' : '晚安';
}
function emptyRow(text, btnText, target){
  return `<div class="empty"><span>${text}</span>${btnText ? `<button class="go" data-go="${target}">${btnText}</button>` : ''}</div>`;
}
const fmtMD = d => d ? d.slice(5).replace('-','/') : '';

(async function init(){
  let session = null;
  try{ ({ data: { session } } = await supabaseClient.auth.getSession()); }catch(e){}
  if(!session){ document.getElementById('hello').textContent = greetWord(); return; }
  const user = session.user, myId = user.id;
  const name = user.user_metadata?.display_name || (user.email || '').split('@')[0] || '';
  document.getElementById('hello').textContent = greetWord() + (name ? '，' + name : '');

  const q = {
    events: supabaseClient.from('calendar_events')
      .select('id, title, start_time, end_time, advisor_id, visibility')
      .lte('event_date', todayStr)
      .or(`end_date.gte.${todayStr},and(end_date.is.null,event_date.eq.${todayStr})`)
      .order('start_time', { ascending:true, nullsFirst:false }),
    week: (()=>{ const w = new Date(); w.setDate(w.getDate() + 1); const a = `${w.getFullYear()}-${pad(w.getMonth()+1)}-${pad(w.getDate())}`;
      w.setDate(w.getDate() + 6); const b = `${w.getFullYear()}-${pad(w.getMonth()+1)}-${pad(w.getDate())}`;
      return supabaseClient.from('calendar_events').select('id, title, event_date, start_time, client_records(client_name)')
        .eq('advisor_id', myId).gte('event_date', a).lte('event_date', b)
        .order('event_date', { ascending:true }).order('start_time', { ascending:true, nullsFirst:false }); })(),
    clients: supabaseClient.from('client_records')
      .select('id, client_name, birthday, status, follow_up_date').eq('advisor_id', myId).is('deleted_at', null),
    reports: supabaseClient.from('client_reports')
      .select('id, saved_at').eq('advisor_id', myId).is('deleted_at', null),
    pays: (()=>{ const soon = new Date(); soon.setDate(soon.getDate() + 14);
      const soonStr = `${soon.getFullYear()}-${pad(soon.getMonth()+1)}-${pad(soon.getDate())}`;
      return supabaseClient.from('contract_payments')
        .select('id, due_date, installment_no, contracts(product_name, client_records(client_name))')
        .eq('advisor_id', myId).eq('paid', false).lte('due_date', soonStr).order('due_date', { ascending:true }); })(),
    names: supabaseClient.from('name_list_entries').select('name').eq('advisor_id', myId)
  };
  const [ev, wk, cl, rp, py, nm] = await Promise.all(Object.values(q).map(p => Promise.resolve(p).catch(e=>({ error:e }))));

  const events = (ev && ev.data) || [];
  const weekEvents = (wk && wk.data) || [];
  const clients = (cl && cl.data) || [];
  const reports = (rp && rp.data) || [];
  const pays = (py && py.data) || [];
  const names = ((nm && nm.data) || []).filter(n => (n.name || '').trim());

  // ---- 今日行程（含客戶生日） ----
  const bdays = clients.filter(c => c.birthday && c.birthday.slice(5) === todayMD);
  document.getElementById('kAgenda').textContent = events.length;
  document.getElementById('kBday').textContent = bdays.length;
  const agendaHTML = bdays.map(c => `<div class="row" data-go="frame-calendar"><span class="when red">🎂 生日</span><div><div class="what">${vcEsc((c.client_name||'').trim() || '（未命名客戶）')} 生日快樂</div><div class="sub">傳個祝福，是最不刻意的關係經營</div></div></div>`).join('')
    + events.map(e => {
      const cut = s => s ? s.slice(0,5) : '';
      const time = e.start_time ? cut(e.start_time) + (e.end_time ? '–' + cut(e.end_time) : '') : '全天';
      const tag = e.advisor_id === myId ? '' : (e.visibility === 'team' ? '團隊公告' : '夥伴行程');
      return `<div class="row" data-go="frame-calendar"><span class="when">${time}</span><div><div class="what">${vcEsc(e.title)}</div>${tag ? `<div class="sub">${tag}</div>` : ''}</div></div>`;
    }).join('');
  document.getElementById('agendaList').innerHTML = agendaHTML || emptyRow('今天沒有安排行程。', '＋ 新增約訪', 'frame-calendar');

  // ---- 該聯絡的客戶：已到期的追蹤 ＋ 未來 7 天的追蹤日與行事曆安排（可以提早提醒客戶） ----
  const addDays = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const weekEnd = addDays(todayStr, 7);
  const dayDiff = ds => Math.round((new Date(ds + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000);
  const WD = ['日','一','二','三','四','五','六'];
  const dateLabel = ds => ds === todayStr ? '今天' : fmtMD(ds) + '（' + WD[new Date(ds + 'T00:00:00').getDay()] + '）';
  const activeClients = clients.filter(c => c.follow_up_date && !['closed','lost'].includes(c.status));
  const dueNow = activeClients.filter(c => c.follow_up_date <= todayStr);
  const items = activeClients.filter(c => c.follow_up_date <= weekEnd).map(c => ({
      date: c.follow_up_date < todayStr ? todayStr : c.follow_up_date, over: c.follow_up_date < todayStr, due: c.follow_up_date <= todayStr, go: 'frame-clientrecords',
      what: (c.client_name || '').trim() || '（未命名客戶）',
      sub: c.follow_up_date < todayStr ? '已過追蹤日，記得聯絡' : (c.follow_up_date === todayStr ? '今天該聯絡' : `追蹤日・${dayDiff(c.follow_up_date)} 天後，可以先提醒客戶`) }))
    .concat(weekEvents.map(e => {
      const cn = e.client_records && e.client_records.client_name ? e.client_records.client_name.trim() : '';
      const t = e.start_time ? e.start_time.slice(0,5) + '　' : '';
      return { date: e.event_date, over: false, due: false, go: 'frame-calendar', what: (cn ? cn + '：' : '') + (e.title || '（未命名）'), sub: `${t}行事曆・${dayDiff(e.event_date)} 天後，可以先提醒客戶` };
    }))
    .sort((a,b) => a.date.localeCompare(b.date) || (b.over - a.over));
  document.getElementById('kFollow').textContent = items.length;
  if(dueNow.length) document.getElementById('kFollowCard').classList.add('alert');
  document.getElementById('followList').innerHTML = items.length
    ? items.slice(0, 6).map(it => `<div class="row" data-go="${it.go}"><span class="when ${it.over ? 'red' : ''}">${dateLabel(it.date)}</span><div><div class="what">${vcEsc(it.what)}</div><div class="sub">${vcEsc(it.sub)}</div></div></div>`).join('')
      + (items.length > 6 ? `<div class="empty"><span>還有 ${items.length - 6} 項</span><button class="go" data-go="frame-calendar">查看行事曆</button></div>` : '')
    : (clients.length ? emptyRow('未來 7 天沒有要聯絡的客戶或行程。', '＋ 新增約訪', 'frame-calendar') : emptyRow('還沒有客戶，從第一份財富地圖開始吧。', '開始財富地圖 →', 'frame-blueprint'));

  // ---- 待繳 ----
  const overdue = pays.filter(x => x.due_date < todayStr).length;
  document.getElementById('kPay').textContent = pays.length;
  document.getElementById('kPayHint').textContent = overdue ? `其中 ${overdue} 筆已逾期` : '14 天內到期';
  if(overdue) document.getElementById('kPayCard').classList.add('alert');
  document.getElementById('payList').innerHTML = pays.length
    ? pays.slice(0, 5).map(x => {
        const od = x.due_date < todayStr;
        const product = x.contracts ? x.contracts.product_name : '';
        const client = x.contracts && x.contracts.client_records ? (x.contracts.client_records.client_name || '（未命名客戶）') : '';
        return `<div class="row" data-go="frame-contracts"><span class="when ${od ? 'red' : ''}">${fmtMD(x.due_date)}</span><div><div class="what">${vcEsc(product)}${od ? '（已逾期）' : ''}</div><div class="sub">${client ? vcEsc(client) + '・' : ''}第 ${x.installment_no} 期</div></div></div>`;
      }).join('')
    : emptyRow('沒有即將到期的款項。', null);

  // ---- 進度 ----
  document.getElementById('sReports').textContent = reports.filter(r => (r.saved_at || '') >= monthStart).length;
  document.getElementById('sClients').textContent = clients.length;
  document.getElementById('sProposal').textContent = clients.filter(c => c.status === 'proposal').length;
  document.getElementById('sClosed').textContent = clients.filter(c => c.status === 'closed').length;

  // ---- 新手上路清單（全部完成或按隱藏後就不再出現） ----
  let dismissed = false;
  try{ dismissed = localStorage.getItem('vc_onboard_hidden') === '1'; }catch(e){}
  const steps = [
    { done: !!(user.user_metadata && user.user_metadata.display_name), text: '設定你的顯示名稱（報告封面會印出來）', go: null, hint: '左下角頭像 → 帳號設定' },
    { done: names.length >= 3, text: '在名單管理列出 3 位想約的朋友', go: 'frame-namelist' },
    { done: reports.length >= 1, text: '完成第一份財富地圖報告', go: 'frame-blueprint' },
    { done: clients.some(c => c.follow_up_date), text: '幫一位客戶設定下次追蹤日期', go: 'frame-clientrecords' }
  ];
  const doneCount = steps.filter(s => s.done).length;
  if(!dismissed && doneCount < steps.length){
    document.getElementById('onboard').hidden = false;
    document.getElementById('obBar').style.width = (doneCount / steps.length * 100) + '%';
    document.getElementById('obSteps').innerHTML = steps.map(s => `
      <div class="ob-step${s.done ? ' done' : ''}" ${s.go && !s.done ? `data-go="${s.go}"` : ''}>
        <span class="ck">${s.done ? '✓' : ''}</span><span class="tx">${s.text}</span>
        <span class="arrow">${s.go ? '前往 →' : (s.hint || '')}</span>
      </div>`).join('');
  }
  document.getElementById('obClose').addEventListener('click', ()=>{
    document.getElementById('onboard').hidden = true;
    try{ localStorage.setItem('vc_onboard_hidden', '1'); }catch(e){}
  });
})();
</script>

</body>
</html>
