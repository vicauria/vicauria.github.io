<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73;
    --warm:#C97B3D; --warm-deep:#A85F27;
    --paper:#F5F7F6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:var(--paper);
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }

  .hero{
    background:radial-gradient(circle at 20% 15%, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 45%),
               radial-gradient(circle at 85% 80%, rgba(201,123,61,0.14) 0%, rgba(201,123,61,0) 50%),
               linear-gradient(150deg, var(--navy) 0%, var(--teal-deep) 55%, var(--teal) 100%);
    min-height:78vh; display:flex; align-items:center; justify-content:center;
    color:#fff; position:relative; overflow:hidden; padding:40px 20px;
  }
  .hero::before{
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:64px 64px;
  }

  .content{ position:relative; z-index:2; max-width:680px; padding:40px; text-align:center; }

  .bg-icons{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .bg-icons svg{ position:absolute; stroke:rgba(255,255,255,0.10); fill:none; stroke-width:1.4; }
  .bg-icons svg.accent{ stroke:rgba(243,201,138,0.14); }
  .bg-icons svg.i1{ top:8%; left:6%; width:120px; height:120px; }
  .bg-icons svg.i2{ bottom:12%; left:10%; width:90px; height:90px; }
  .bg-icons svg.i3{ top:14%; right:8%; width:140px; height:140px; }
  .bg-icons svg.i4{ bottom:8%; right:12%; width:100px; height:100px; }
  .bg-icons svg.i5{ top:46%; left:3%; width:70px; height:70px; }
  .bg-icons svg.i6{ top:42%; right:4%; width:80px; height:80px; }

  .eyebrow{
    font-family:"Roboto Mono", monospace; font-size:12px; letter-spacing:.32em;
    text-transform:uppercase; color:#BFE0EA; margin-bottom:28px; opacity:.9;
  }

  .greeting{
    font-size:15px; color:#DCEAEE; margin-bottom:14px; letter-spacing:.02em;
  }
  .greeting b{ color:#fff; font-weight:700; }

  .headline{
    font-family:"Noto Serif TC", serif; font-weight:700;
    font-size:clamp(28px, 4.4vw, 44px); line-height:1.5; margin:0 0 22px;
    color:#fff;
  }
  .headline .accent{ color:#F3C98A; }

  .tagline{
    font-size:14.5px; color:#DCEAEE; line-height:2; max-width:480px; margin:0 auto 40px;
  }

  .brand-marks{
    display:flex; align-items:center; justify-content:center; gap:16px;
    font-family:"Roboto Mono", monospace; font-size:12px; letter-spacing:.14em;
    color:rgba(255,255,255,0.55); margin-bottom:8px;
  }
  .brand-marks .dot{ width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,0.35); }

  .datetime{
    font-family:"Roboto Mono", monospace; font-size:11.5px; color:rgba(255,255,255,0.4);
    margin-top:36px; letter-spacing:.04em;
  }

  /* ---------- 下方：工具捷徑卡片 ---------- */
  .tools-section{max-width:1000px; margin:0 auto; padding:48px 24px 60px;}
  .tools-title{
    font-family:"Roboto Mono", monospace; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--teal-deep); font-weight:700; margin-bottom:10px; text-align:center;
  }
  .tools-sub{text-align:center; font-size:13px; color:#5B6B70; margin-bottom:32px;}
  .tools-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:820px){ .tools-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .tools-grid{grid-template-columns:1fr;} }
  .tool-card{
    background:#fff; border:1px solid #E1E7E7; border-radius:14px; padding:20px 18px;
    cursor:pointer; text-align:left; transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 4px 14px rgba(20,50,60,0.04);
  }
  .tool-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,50,60,0.1);}
  .tool-card .badge{
    display:block; font-size:26px; margin-bottom:12px; line-height:1;
  }
  .tool-card .t{font-family:"Noto Serif TC",serif; font-weight:700; font-size:14.5px; color:var(--navy); margin-bottom:6px;}
  .tool-card .d{font-size:12px; color:#5B6B70; line-height:1.7;}

  .agenda-row{
    display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #E1E7E7;
    border-radius:12px; padding:12px 16px; margin-bottom:8px; cursor:pointer;
  }
  .agenda-row:hover{border-color:#2E7391;}
  .agenda-row .a-time{
    font-family:"Roboto Mono",monospace; font-size:12px; color:#2E7391; font-weight:700;
    width:76px; flex-shrink:0;
  }
  .agenda-row .a-title{font-size:13px; color:#182226; font-weight:600;}
  .agenda-row .a-meta{font-size:11px; color:#5B6B70; margin-top:2px;}
</style>
</head>
<body>

<div class="hero">
  <div class="bg-icons">
    <!-- 成長曲線 -->
    <svg class="i1" viewBox="0 0 100 100"><polyline points="8,80 30,55 48,65 70,30 92,15"/><circle cx="92" cy="15" r="3"/></svg>
    <!-- 羅盤 -->
    <svg class="i2 accent" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38"/><polygon points="50,22 58,50 50,78 42,50"/><circle cx="50" cy="50" r="3"/></svg>
    <!-- 硬幣堆疊 -->
    <svg class="i3" viewBox="0 0 100 100"><ellipse cx="50" cy="30" rx="34" ry="10"/><ellipse cx="50" cy="50" rx="34" ry="10"/><ellipse cx="50" cy="70" rx="34" ry="10"/></svg>
    <!-- 天平 -->
    <svg class="i4 accent" viewBox="0 0 100 100"><line x1="50" y1="12" x2="50" y2="82"/><line x1="18" y1="30" x2="82" y2="30"/><circle cx="18" cy="46" r="12"/><circle cx="82" cy="46" r="12"/><line x1="30" y1="88" x2="70" y2="88"/></svg>
    <!-- 上升箭頭 -->
    <svg class="i5" viewBox="0 0 100 100"><polyline points="10,85 40,55 58,68 90,20"/><polyline points="66,20 90,20 90,44"/></svg>
    <!-- 錢幣符號圈 -->
    <svg class="i6 accent" viewBox="0 0 100 100"><circle cx="50" cy="50" r="36"/><line x1="50" y1="28" x2="50" y2="72"/><path d="M62,38 C62,30 38,30 38,42 C38,54 62,46 62,58 C62,70 38,70 38,62"/></svg>
  </div>

  <div class="content">
    <div class="eyebrow">Vicauria · Financial Advisor Workspace</div>
    <div class="greeting" id="greeting">Hi，歡迎回來。</div>
    <h1 class="headline">覺醒，是看懂金錢的<span class="accent">第一步</span>；<br>陪你走到底的，是故事。</h1>
    <p class="tagline">每一次規劃，都是為了讓我們更靠近真正想要的人生。<br>從覺醒開始，用金錢說故事，陪每位到我們面前的人穩穩走向財務自由。</p>
    <div class="brand-marks">
      <span>覺醒</span><span class="dot"></span><span>金錢</span><span class="dot"></span><span>故事</span>
    </div>
    <div class="datetime" id="datetime"></div>
  </div>
</div>

<div class="tools-section">
  <div class="tools-title">Quick Access</div>
  <div class="tools-sub">點一下直接跳過去，不用再回頭找側邊欄</div>
  <div class="tools-grid" id="toolsGrid"></div>
</div>

<div class="tools-section" id="agendaSection" style="display:none;">
  <div class="tools-title">今日行程</div>
  <div class="tools-sub" id="agendaSub"></div>
  <div id="agendaList" style="margin-top:14px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
  const TOOLS = [
    {target:'frame-calendar', badge:'📅', title:'行事曆', desc:'約訪行程／團隊公告'},
    {target:'frame-blueprint', badge:'🗺️', title:'財富地圖', desc:'顧問式引導問卷／財富畫像報告'},
    {target:'frame-clientrecords', badge:'🗂️', title:'客戶資料', desc:'已填答的財富地圖紀錄'},
    {target:'frame-marketnews', badge:'📰', title:'市場快訊', desc:'即時財經新聞／自動分類'},
    {target:'frame-marketoverview', badge:'📊', title:'市場概況', desc:'即時匯率／全球指數／大盤走勢'},
    {target:'frame-simulation', badge:'🎯', title:'沙盤推演必勝', desc:'退休／購屋／教育／遺贈／投資試算機'},
    {target:'frame-cashflow', badge:'💧', title:'收支現金流', desc:'收入／支出／年度結餘／儲蓄率'},
    {target:'frame-balance', badge:'⚖️', title:'資產負債表', desc:'資產／負債／淨值／負債比'},
    {target:'frame-loan', badge:'🏦', title:'貸款試算室', desc:'車貸信貸／房貸／寬限期／利差'},
    {target:'frame-efficiency', badge:'📈', title:'資金效率健檢', desc:'通膨與資金效率快篩'},
    {target:'frame-team', badge:'👥', title:'團隊', desc:'工作量監控／加入其他顧問的團隊'},
    {target:'frame-feedback', badge:'📮', title:'意見箱', desc:'功能異常回報／改進建議'}
  ];

  const grid = document.getElementById('toolsGrid');
  grid.innerHTML = TOOLS.map(t=>`
    <div class="tool-card" data-target="${t.target}">
      <div class="badge">${t.badge}</div>
      <div class="t">${t.title}</div>
      <div class="d">${t.desc}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.tool-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if(window.parent && typeof window.parent.goToModule === 'function'){
        window.parent.goToModule(card.dataset.target);
      }
    });
  });

  (async function(){
    try{
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(session){
        const user = session.user;
        const name = user.user_metadata?.display_name || user.email || '';
        if(name){
          document.getElementById('greeting').innerHTML = 'Hi，歡迎回來，<b>'+name+'</b> 顧問。';
        }
        await loadTodayAgenda(user.id);
      }
    }catch(e){}

    const now = new Date();
    const weekday = ['週日','週一','週二','週三','週四','週五','週六'][now.getDay()];
    const p = n => String(n).padStart(2,'0');
    document.getElementById('datetime').textContent =
      now.getFullYear()+'/'+p(now.getMonth()+1)+'/'+p(now.getDate())+'（'+weekday+'）　'+p(now.getHours())+':'+p(now.getMinutes());
  })();

  async function loadTodayAgenda(myId){
    const p = n => String(n).padStart(2,'0');
    const t = new Date();
    const todayStr = `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
    try{
      const { data, error } = await supabaseClient
        .from('calendar_events')
        .select('id, title, start_time, end_time, advisor_id, visibility')
        .eq('event_date', todayStr)
        .order('start_time', { ascending:true, nullsFirst:false });
      if(error || !data || data.length===0) return;

      const section = document.getElementById('agendaSection');
      const sub = document.getElementById('agendaSub');
      const list = document.getElementById('agendaList');
      sub.textContent = `今天共有 ${data.length} 筆安排，點一下直接前往行事曆查看`;
      list.innerHTML = data.map(e=>{
        const cut = s => s ? s.slice(0,5) : '';
        const time = e.start_time ? (e.end_time ? `${cut(e.start_time)}–${cut(e.end_time)}` : cut(e.start_time)) : '全天';
        const tag = e.advisor_id===myId ? '' : (e.visibility==='team' ? '（團隊公告）' : '（夥伴行程）');
        return `<div class="agenda-row"><span class="a-time">${time}</span><div><div class="a-title">${e.title}${tag}</div></div></div>`;
      }).join('');
      list.querySelectorAll('.agenda-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          if(window.parent && typeof window.parent.goToModule === 'function'){
            window.parent.goToModule('frame-calendar');
          }
        });
      });
      section.style.display = 'block';
    }catch(e){ console.error('讀取今日行程失敗', e); }
  }
</script>

</body>
</html>
