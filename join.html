<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://s3.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://inmtoymzpkprpmympaek.supabase.co wss://inmtoymzpkprpmympaek.supabase.co https://api.rss2json.com https://open.er-api.com; frame-src 'self' https://*.tradingview.com https://*.tradingview-widget.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>(function(){try{if(window.top!==window.self&&window.top.location.origin!==window.location.origin)throw 0;}catch(e){document.documentElement.style.display="none";try{window.top.location=window.location.href;}catch(x){}}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>加入企業 — Vicauria</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#16323F; --teal:#2E7391; --teal-deep:#1F5C73; --teal-tint:#E6F0F2; --warm:#C97B3D; --warm-tint:#FBEFE2; --ink:#182226; --ink-soft:#5B6B70; --paper:#F5F7F6; --card:#fff; --line:#E1E7E7; --negative:#B3492F; --positive:#2E7D5B;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:"Noto Sans TC",sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;}
  .box{width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 50px rgba(20,50,60,.1); padding:32px 30px; text-align:center;}
  .logo{width:46px; height:46px; margin:0 auto 12px;} .logo img{width:100%; height:100%; object-fit:contain;}
  h1{font-family:"Noto Serif TC",serif; font-size:20px; color:var(--navy); margin:0 0 8px;}
  p{font-size:13.5px; color:var(--ink-soft); margin:0 0 14px;}
  input{width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:11px; font-family:"Roboto Mono",monospace; font-size:20px; letter-spacing:.25em; text-align:center; text-transform:uppercase;}
  input:focus{outline:none; border-color:var(--teal);}
  .btn{display:inline-block; width:100%; margin-top:14px; padding:13px; border:none; border-radius:26px; background:var(--navy); color:#fff; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; text-decoration:none;}
  .btn:hover{background:var(--teal-deep);} .btn:disabled{opacity:.6; cursor:default;}
  .btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
  .msg{font-size:13px; margin-top:12px; min-height:20px;} .msg.err{color:var(--negative);} .msg.ok{color:var(--positive);}
  .status{border-radius:12px; padding:14px 16px; font-size:13.5px; margin-bottom:6px; text-align:left;}
  .status.wait{background:var(--warm-tint); color:#8A4F1F;} .status.ok{background:#E8F4EE; color:var(--positive);} .status.no{background:#F6E9E5; color:var(--negative);}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="icons/vicauria-mark.png" alt=""></div>
  <h1>加入企業</h1>
  <div id="view"><p>載入中…</p></div>
</div>

<script src="vendor/supabase-js-2.117.2.js"></script>
<script src="supabase-config.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'vc_join_code';
const view = document.getElementById('view');
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);

function readStoredCode(){
  try{ const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if(o && Date.now() - o.t < 86400000) return cleanCode(o.c); }catch(e){}
  return '';
}
function storeCode(c){ try{ localStorage.setItem(KEY, JSON.stringify({ c, t: Date.now() })); }catch(e){} }
function clearCode(){ try{ localStorage.removeItem(KEY); }catch(e){} }

async function init(){
  const urlCode = cleanCode(new URLSearchParams(location.search).get('code'));
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){
    // 還沒登入：先記住邀請碼，登入後會自動回到這一頁
    if(urlCode) storeCode(urlCode);
    view.innerHTML = '<p>請先登入（還沒有帳號的話請先註冊並驗證信箱），登入後會自動回到這一頁繼續加入。</p><a class="btn" href="login.html">前往登入</a><a class="btn ghost" href="register.html">註冊新帳號</a>';
    return;
  }
  const mine = await supabaseClient.rpc('vc_my_org');
  if(mine.data){
    clearCode();
    view.innerHTML = '<div class="status ok">你已經是「' + esc(mine.data.name) + '」的成員了。</div><a class="btn" href="workbench.html">進入工作台</a>';
    return;
  }
  const req = await supabaseClient.rpc('vc_my_join_request');
  if(req.error){
    view.innerHTML = '<p>目前無法使用這個功能，請稍後再試。</p><a class="btn ghost" href="workbench.html">回工作台</a>';
    return;
  }
  const r = req.data;
  if(r && r.status === 'pending'){ showPending(r.org_name); return; }
  const pre = urlCode || readStoredCode(); clearCode();   // 已經帶進輸入框，不再留著，避免之後登入又被帶回這頁
  showForm(pre, r && r.status === 'rejected' ? '上次的申請沒有通過，如有需要可以重新輸入邀請碼再申請。' : '');
}

function showPending(orgName){
  clearCode();
  view.innerHTML = '<div class="status wait">已送出加入「' + esc(orgName) + '」的申請，正在等待企業管理者審核。</div><p>通過後，下次進入工作台就會自動套用企業設定。</p><a class="btn ghost" href="workbench.html">先回工作台</a>';
}

function showForm(code, note){
  view.innerHTML = (note ? '<div class="status no">' + esc(note) + '</div>' : '')
    + '<p>請輸入企業管理者給你的 8 碼邀請碼。送出後需要企業管理者審核通過才會加入。</p>'
    + '<input id="code" maxlength="9" placeholder="邀請碼" autocomplete="off" value="' + esc(code) + '">'
    + '<button class="btn" id="go" type="button">送出加入申請</button><div class="msg" id="msg"></div>'
    + '<a class="btn ghost" href="workbench.html">先不加入，回工作台</a>';
  const input = document.getElementById('code'), go = document.getElementById('go'), msg = document.getElementById('msg');
  input.addEventListener('input', ()=> input.value = cleanCode(input.value));
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') go.click(); });
  go.addEventListener('click', async ()=>{
    const c = cleanCode(input.value);
    if(c.length !== 8){ msg.className = 'msg err'; msg.textContent = '邀請碼是 8 個字，請再確認一次。'; return; }
    go.disabled = true; msg.className = 'msg'; msg.textContent = '送出中…';
    const { data, error } = await supabaseClient.rpc('vc_org_request_join', { p_code: c });
    go.disabled = false;
    if(error || !data){ msg.className = 'msg err'; msg.textContent = '送出失敗，請檢查網路後再試一次。'; return; }
    if(data.ok){ showPending(data.org_name); return; }
    msg.className = 'msg err';
    msg.textContent = ({
      not_found: '這組邀請碼不正確，或已經過期。請向企業管理者確認。',
      too_many: '嘗試次數太多了，請 1 小時後再試。',
      already_in_org: '你的帳號已經屬於一個企業，無法再加入另一個。',
      pending: '你已經有一筆待審核的申請（' + (data.org_name || '') + '），請等待企業管理者處理。',
      not_logged_in: '登入已過期，請重新登入。'
    })[data.reason] || '送出失敗，請稍後再試。';
  });
}
init();
</script>
</body>
</html>
