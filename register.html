<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>註冊｜資產配置工作台</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16323F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16323F; --ink-deep:#0F232C; --paper:#F5F7F6;
    --brass:#2E7391; --brass-light:#8FC4D8;
    --line:#E1E7E7; --ink-soft:#5B6B70; --negative:#B3492F; --positive:#2E7D5B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Sans TC", sans-serif;
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-deep) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    width:100%; max-width:400px;
    background:#fff; border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,0.35);
    padding:44px 36px 36px;
  }
  .logo{
    font-family:"Roboto Mono", monospace; font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--brass); margin-bottom:16px; text-align:center;
  }
  h1{
    font-family:"Noto Serif TC", serif; font-weight:800; font-size:22px;
    color:var(--ink); text-align:center; margin:0 0 6px;
  }
  .sub{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:32px; }

  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:12.5px; font-weight:700; color:var(--ink);
    margin-bottom:7px;
  }
  .field input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:9px;
    font-size:14px; font-family:"Noto Sans TC", sans-serif; color:var(--ink);
    background:var(--paper);
  }
  .field input:focus{ outline:none; border-color:var(--brass); }
  .field-hint{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  .submit-btn{
    width:100%; margin-top:8px; padding:13px; border:none; border-radius:9px;
    background:var(--ink); color:#fff; font-size:14.5px; font-weight:700;
    cursor:pointer; font-family:"Noto Sans TC", sans-serif;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--brass); }
  .submit-btn:disabled{ opacity:.6; cursor:default; }

  .error-msg{
    display:none; background:rgba(179,73,47,0.08); border:1px solid rgba(179,73,47,0.25);
    color:var(--negative); font-size:12.5px; padding:10px 12px; border-radius:8px;
    margin-bottom:16px;
  }
  .error-msg.show{ display:block; }

  .success-box{
    display:none; text-align:center;
  }
  .success-box.show{ display:block; }
  .success-box .icon{ font-size:32px; margin-bottom:14px; }
  .success-box p{ font-size:13.5px; color:var(--ink); line-height:1.9; margin-bottom:24px; }

  .back-home{
    display:block; text-align:center; margin-top:22px; font-size:12.5px;
    color:var(--ink-soft); text-decoration:none;
  }
  .back-home:hover{ color:var(--brass); }

  .login-link{
    display:block; text-align:center; margin-top:16px; font-size:12.5px;
    color:var(--brass); text-decoration:none; font-weight:600;
  }
  .login-link:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">Vicauria</div>
  <h1>建立顧問帳號</h1>
  <p class="sub">註冊一組屬於你自己的帳號</p>

  <div class="error-msg" id="errorMsg"></div>

  <form id="registerForm">
    <div class="field">
      <label for="displayName">顧問名稱</label>
      <input type="text" id="displayName" placeholder="顯示在工作台上的名稱" autocomplete="name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密碼</label>
      <input type="password" id="password" placeholder="至少 6 個字元" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirmPassword">確認密碼</label>
      <input type="password" id="confirmPassword" placeholder="再輸入一次密碼" autocomplete="new-password">
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">註冊</button>
  </form>

  <a href="login.html" class="login-link">已經有帳號了？直接登入</a>

  <div class="success-box" id="successBox">
    <div class="icon">📩</div>
    <p>註冊申請已送出！<br>請到你的信箱收信，點擊驗證信裡的連結完成驗證，之後就可以登入了。</p>
    <a href="login.html" class="submit-btn" style="display:block; text-decoration:none; text-align:center; box-sizing:border-box;">前往登入頁</a>
  </div>

  <a href="index.html" class="back-home">← 回首頁</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const errorMsg = document.getElementById('errorMsg');
  function showError(text){
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
  }

  document.getElementById('registerForm').addEventListener('submit', async function(e){
    e.preventDefault();
    errorMsg.classList.remove('show');

    const displayName = document.getElementById('displayName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const submitBtn = document.getElementById('submitBtn');

    if(!displayName || !email || !password || !confirmPassword){
      showError('請完整填寫所有欄位');
      return;
    }
    if(password.length < 6){
      showError('密碼至少要 6 個字元');
      return;
    }
    if(password !== confirmPassword){
      showError('兩次輸入的密碼不一致');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '註冊中…';

    const { data, error } = await supabaseClient.auth.signUp({
      email, password,
      options: { data: { display_name: displayName } }
    });

    if(error){
      submitBtn.disabled = false;
      submitBtn.textContent = '註冊';
      if(error.message.includes('already registered') || error.message.includes('User already registered')){
        showError('這個 Email 已經註冊過了，請直接登入或改用忘記密碼。');
      } else {
        showError('註冊失敗：' + error.message);
      }
      return;
    }

    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('successBox').classList.add('show');
  });
</script>

</body>
</html>
